<style>
/* ===== motion-site engine v1：土台 =====
   色・書体はすべて台本（site.json の brand）から CSS変数で入る。

:root{--gutter:clamp(16px,4.5vw,48px);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:clip}

main{position:relative;z-index:1}
.chap{position:relative}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.abs{position:absolute}
h1,h2,h3,p{margin:0}
ul{list-style:none;margin:0;padding:0}
.eyebrow{font-size:14px;letter-spacing:.2em;color:var(--accent);margin:0 0 10px}
.disp{font-family:var(--display);font-weight:500}
.glass{background:var(--panel);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);border:1px solid var(--line);border-radius:18px}
.shadow-txt{text-shadow:0 2px 28px rgba(0,0,0,.6)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 28px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);
  font:700 16px/1.2 var(--body);text-decoration:none;cursor:pointer;white-space:nowrap;transition:transform .15s}

.btn:active{transform:translateY(1px) scale(.98)}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--ink);border:1px solid rgba(255,255,255,.32)}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* 固定ヘッダー（ブランド名＋主CTA） */
.topbar{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 10px);left:var(--gutter);right:var(--gutter);display:flex;justify-content:space-between;align-items:center;gap:12px;pointer-events:none}
.topbar .mark{pointer-events:auto;min-height:48px;display:flex;align-items:center;color:var(--ink);text-decoration:none;font-family:var(--display);font-size:18px;letter-spacing:.2em;white-space:nowrap;text-shadow:0 1px 14px rgba(0,0,0,.6)}
.topbar .btn{pointer-events:auto;min-height:48px;padding:0 20px;font-size:14px}
.topbar .mark{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:440px){.topbar .mark{font-size:15px;letter-spacing:.1em}.topbar .btn{padding:0 14px}}   /* 狭い画面でもヘッダーを1行に収める */
@media (max-width:360px){.topbar .mark{font-size:14px;letter-spacing:.04em}.topbar .btn{padding:0 12px}}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);z-index:40;opacity:0;width:max-content;max-width:calc(100% - 2*var(--gutter));
  background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:500;transition:.35s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 型：hero（ヒーロー。商品が暗闇に浮かび、カメラが寄る） ---------- */
.t-hero .copy{left:var(--gutter);right:var(--gutter);bottom:calc(env(safe-area-inset-bottom,0px) + 13vh);text-align:center}
.t-hero h1{font-family:var(--display);font-weight:500;font-size:clamp(30px,5.6vw,64px);line-height:1.4;letter-spacing:.04em}
.t-hero .lead{margin-top:12px;color:var(--muted);font-size:clamp(16px,1.4vw,18px)}
.t-hero .mid{inset:0;display:grid;place-items:center;text-align:center;padding:0 var(--gutter);opacity:0}
.t-hero .mid h2{font-family:var(--display);font-weight:500;font-size:clamp(26px,4.4vw,54px);line-height:1.45}
.t-hero .hint{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);font-size:14px;letter-spacing:.24em;color:var(--muted);text-align:center;white-space:nowrap}

.callout .tx{display:block;min-width:0}
.callout b{display:block;font-size:16px;line-height:1.5}
.callout span{display:block;font-size:14px;line-height:1.6;color:var(--muted)}
.no-gl .t-explode .callouts{position:absolute;left:var(--gutter);right:var(--gutter);top:42%;display:grid;gap:14px}

/* ---------- 型：xray（中身。成分ごとに光らせる） ---------- */

.t-showcase .chip{padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transform:translateX(16px)}
.t-showcase .spinbox{right:var(--gutter);bottom:9vh;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.t-showcase .spinbox small{font-size:14px;color:var(--muted)}
@media (max-width:760px){
  .t-showcase .chips{left:var(--gutter);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
  .t-showcase .spinbox{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 196px)}
}

/* ---------- 型：cta（申込み。粒の流れの上に申込みカード） ---------- */
.t-cta{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
.t-cta .inner{position:relative;flex:1;display:grid;grid-template-columns:minmax(0,1fr);align-content:center;gap:28px;padding:110px var(--gutter) 48px;max-width:1120px;margin:0 auto;width:100%}
.t-cta .inner::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,color-mix(in srgb,var(--bg) 82%,transparent),transparent)}  /* 粒の流れの上でも文字を読めるように */
.t-cta h2{font-family:var(--display);font-weight:500;font-size:clamp(30px,5vw,64px);line-height:1.4;text-shadow:0 2px 28px rgba(0,0,0,.7)}
.t-cta .inner>*,.t-cta .plan>*{min-width:0}   /* 長い日本語でも枠を押し広げない */
.t-cta .plan{padding:clamp(20px,4vw,34px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:24px;align-items:center;max-width:860px}
.t-cta .price{font-family:var(--display);font-size:clamp(36px,8vw,48px);line-height:1.2}
.t-cta .price small{display:block;font-family:var(--body);font-size:16px;color:var(--muted)}
.t-cta .sub{color:var(--muted);margin-top:6px}
.t-cta .plan ul{padding-left:1.2em;list-style:disc;color:var(--muted)}
.t-cta .act{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.t-cta .act p{font-size:14px;color:var(--muted)}
.t-cta footer{position:relative;padding:22px var(--gutter) calc(env(safe-area-inset-bottom,0px) + 28px);border-top:1px solid var(--line);font-size:14px;color:var(--muted);background:var(--bg)}
.t-cta footer p{margin:0 0 4px}

/* WebGLが使えない環境 */
.no-gl .stage{background:radial-gradient(ellipse 70% 60% at 50% 45%,var(--bg2),var(--bg))}

</style>

<script type="module">
/* ===== motion-site engine v1 =====
   UGOKU（体験型サイトの手本）を因数分解した共通エンジン。
   ① 骨格：章（縦に長い section）＋舞台（sticky）＋進み具合 p（0→1）＋なめらか補正＋1本のループ
   ② 絵　：three.js の WebGL を背面1枚に固定し、各章の舞台の位置にだけ描く（scissor）
   ③ 文字：DOM。進み具合 p の範囲で、出る・消える・切り替わるを決める
   ④ 型　：TYPES に章の型を登録。台本（window.SITE）は「型と文言と色」だけを書く
   ※ このファイルは build.py で index.html に埋め込まれる。閉じタグの文字列を書かないこと。 */

/* ---------------- 道具 ---------------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(p,a,b)=>clamp((p-a)/(b-a));                 /* p が a→b の間で 0→1 */
const io3=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;       /* ゆっくり→速く→ゆっくり */
const o3=t=>1-Math.pow(1-t,3);                          /* 速く→ゆっくり */
const bell=(p,a,b,f=.08)=>Math.min(seg(p,a,a+f),1-seg(p,b-f,b)); /* a〜bの間だけ1（前後fでフェード） */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(7);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOB=innerWidth<760;
const port=r=>r.width<r.height;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const SITE=window.SITE, BR=SITE.brand;

/* 色・書体を CSS変数へ */
const rs=document.documentElement.style;
[['--bg',BR.bg],['--bg2',BR.bg2||BR.bg],['--ink',BR.ink],['--muted',BR.muted],['--accent',BR.accent],['--accent-ink',BR.accentInk],

/* ---------------- 章の型（TYPES） ----------------
   html(ch)        舞台の中身（文字だけ。台本の文言を入れる）
   dom(c,t)        毎フレーム、進み具合 c.ps で文字を動かす

const TYPES={};

    <div class="abs copy shadow-txt" data-q="copy"><h1 class="jw">${br(ch.title)}</h1>${ch.lead?`<p class="lead jw">${br(ch.lead)}</p>`:''}</div>

  dom(c){const p=c.ps,q=c.q;
    set(q.copy,1-seg(p,.12,.26),`translateY(${-seg(p,0,.26)*50}px)`);
    q.mid&&set(q.mid,bell(p,.42,.92,.1),`translateY(${lerp(30,-30,seg(p,.42,.92))}px)`);
    q.hint&&set(q.hint,1-seg(p,0,.05));

  build(ch){const scene=stdScene(),cam=new THREE.PerspectiveCamera(32,1,.1,80);

  gl(c,t){const s=c.s,p=c.ps,pt=port(c.r),a=io3(seg(p,0,1));

/* ===== explode（パーツが離れ、説明線が付く） ===== */
TYPES.explode={
  html:ch=>`<div class="stage">
    <div class="abs head shadow-txt" data-q="head">${ch.eyebrow?`<p class="eyebrow">${esc(ch.eyebrow)}</p>`:''}<h2 class="jw">${br(ch.title)}</h2></div>
    <div class="callouts">${ch.parts.map(pt=>`<div class="abs callout" data-part="${esc(pt.key)}"><i></i><span class="tx"><b>${esc(pt.title)}</b><span class="jw">${esc(pt.text)}</span></span></div>`).join('')}</div></div>`,
  dom(c){set(c.q.head,1-seg(c.ps,.86,.96))},
  build(ch){const scene=stdScene(),cam=new THREE.PerspectiveCamera(34,1,.1,80);
    const prod=makeProduct(ch.product);scene.add(prod.g);
    keyLight(scene,'#ffffff',1.7,[-4,7,8]);keyLight(scene,BR.accent,.5,[5,2,-4]);
    const notes={};$$('.callout',c_el(ch)).forEach(n=>notes[n.dataset.part]=n);
    return{scene,cam,prod,notes,bg:makeBg(0,ch.bg?.[0]||'#141B30',ch.bg?.[1]||'#04060C'),v:new THREE.Vector3(),rt:new THREE.Vector3()}},
  gl(c,t){const s=c.s,p=c.ps,pt=port(c.r),P=s.prod.parts,A=io3(seg(p,.04,.5)),Z=io3(seg(p,.82,1));
    /* 分解：キャップは上、ラベルは少し上へ浮いて大きく、本体は下へ、中のカプセルは輪になって回る */
    P.cap.position.y=2.2*A;P.cap.rotation.z=.3*A;
    P.label.position.y=1.0*A;P.label.scale.setScalar(1+.1*A);
    P.body.position.y=-1.4*A;P.body.material.opacity=lerp(s.prod.o.glassOpacity||.55,.28,A);
    const ring=p*Math.PI*1.4+(RM?0:t*.15),rr=pt?1.2:1.85;   /* スマホは輪を小さく（説明線の場所を空ける） */
    P.caps.forEach((cp,i)=>{const k=io3(seg(p,.1+i*.02,.48+i*.02)),a=i/P.caps.length*Math.PI*2+ring;
      cp.position.set(lerp(cp.userData.x,Math.cos(a)*rr,k),lerp(cp.userData.y,3.6+Math.sin(a*2)*.12,k),lerp(cp.userData.z,Math.sin(a)*rr,k));
      cp.rotation.set(lerp(cp.userData.rx,.25,k),lerp(0,-a,k),lerp(cp.userData.rz,Math.PI/2,k))});
    s.prod.g.rotation.y=lerp(-.35,.35,p)+(RM?0:Math.sin(t*.4)*.05);
    /* カメラ：全体を収める → 最後は輪の手前のカプセルへ寄る（次の章へのつなぎ） */
    const cam=s.cam;cam.fov=lerp(pt?46:34,pt?30:22,Z);
    const lx=pt?1.3:.45;   /* 説明線を右に出すため、物を左へ寄せて見る（スマホは大きく寄せる） */
    cam.position.set(lerp(mouse.sx*.5,0,Z),lerp(2.2-mouse.sy*.3,3.4,Z),lerp(pt?19:15.5,pt?7:6,Z));look(cam,lerp(lx,0,Z),lerp(pt?2.6:1.85,3.5,Z),0);
    draw(c.r,BR.bg,s.bg,s.scene,cam);
    /* 説明線：3Dの位置を画面の位置に変換して、文字を横に置く */
    const W=c.r.width,H=c.r.height,gut=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gutter'))||16;
    s.rt.set(1,0,0).applyQuaternion(cam.quaternion);
    /* パーツごとの「説明線の付け根」：ボトルの中での高さ と 右側への張り出し */
    const AN={cap:[P.cap.position.y+2.8,.62],label:[P.label.position.y+1.05,1.14],body:[P.body.position.y+.9,1.04],caps:[3.6,rr+.1]};
    const vis=bell(p,.3,.86,.08);
    if(vis>0&&!s.wrapped){s.wrapped=1;setTimeout(()=>window.jpWrap&&window.jpWrap.run(),60)}   /* 説明文の幅が決まってから改行位置を計算 */
    Object.entries(s.notes).forEach(([k,n])=>{const a=AN[k];if(!a)return;
      s.v.set(0,a[0],0);s.prod.g.localToWorld(s.v);s.v.addScaledVector(s.rt,a[1]).project(cam);
      const x=(s.v.x+1)/2*W,y=(1-s.v.y)/2*H;
      n.style.transform=`translate(${x-4}px,${y}px) translateY(-50%)`;
      n.querySelector('.tx').style.maxWidth=Math.max(120,W-x-gut-60)+'px';
      n.style.opacity=vis;n.querySelector('i').style.transform=`scaleX(${vis})`;
    });
  }
};

  gl(c,t,dt){const s=c.s,p=c.ps,pt=port(c.r),k=1-Math.exp(-dt*6),o=io3(seg(p,0,.16));
    s.cap.cap.position.y=1.0*o;s.cap.cap.rotation.z=.2*o;            /* カプセルが割れる */
    s.groups.forEach((g,i)=>{const on=i===c.idx;g.m.color.lerp(on?g.on:s.off,k);g.m.emissive.lerp(on?g.on:s.black,k);g.m.emissiveIntensity=.5});
    s.cap.g.rotation.set(0,0,pt?.18:Math.PI/2-.12);s.cap.g.position.set(pt?0:.35,pt?-.45:.15,0);s.cap.g.scale.setScalar(pt?.82:1.3);
    s.cap.inner.rotation.y=p*Math.PI*2+(RM?0:t*.12);
    s.cam.fov=32;s.cam.position.set(mouse.sx*.4,-mouse.sy*.3+.6,pt?13:10.5);look(s.cam,0,pt?.1:0,0);
    draw(c.r,BR.bg,s.bg,s.scene,s.cam);

    s.outer.scale.setScalar(pt?1.3:2.1);s.cap.inner.rotation.y=p*Math.PI*3.2+(RM?0:t*.12);

/* ---------------- DOM の組み立て ---------------- */
function set(el,o,tf){if(!el)return;el.style.opacity=o;if(tf!==undefined)el.style.transform=tf}
function countUp(el,to,unit){const t0=performance.now(),dur=RM?1:800;
  (function f(now){const k=clamp((now-t0)/dur);el.innerHTML=Math.round(to*o3(k)).toLocaleString('ja-JP')+`<small>${esc(unit)}</small>`;if(k<1)requestAnimationFrame(f)})(t0)}
const main=$('#chapters');
SITE.chapters.forEach((ch,i)=>{const T=TYPES[ch.type];if(!T)throw new Error('未登録の型: '+ch.type);
  const sec=document.createElement('section');sec.className='chap t-'+ch.type;sec.id=ch.id||('c'+i);
  if(!T.enter)sec.style.height=(ch.vh||300)+'vh';sec.innerHTML=T.html(ch);main.appendChild(sec)});
const chaps=$$('.chap').map((el,i)=>{const ch=SITE.chapters[i],T=TYPES[ch.type],q={};
  $$('[data-q]',el).forEach(n=>q[n.dataset.q]=n);
  return{el,ch,T,q,stage:el.querySelector('.stage')||el,enter:!!T.enter,p:0,ps:0,vis:false,r:null,ready:false,idx:-1,s:null}});
function c_el(ch){return chaps.find(c=>c.ch===ch).el}

function measure(){const vh=innerHeight;
  for(const c of chaps){const r=c.el.getBoundingClientRect();
    c.p=c.enter?clamp(1-r.top/vh):clamp(-r.top/Math.max(1,r.height-vh));
    c.r=c.stage.getBoundingClientRect();c.vis=c.r.bottom>-1&&c.r.top<vh+1;
    if(!c.ready){c.ps=c.p;c.ready=true}}}

/* ---------------- ループ（文字は three.js を待たずに先に動かす） ---------------- */
let T=0,last=performance.now(),glOn=false;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000)||.016;last=now;T+=dt;
  measure();
  const k=1-Math.exp(-dt*(RM?30:7));                      /* なめらか補正：少し遅れて追いかける */
  for(const c of chaps){c.ps+=(c.p-c.ps)*k;if(Math.abs(c.p-c.ps)<1e-4)c.ps=c.p}
  mouse.sx+=(mouse.x-mouse.sx)*.05;mouse.sy+=(mouse.y-mouse.sy)*.05;
  for(const c of chaps)if(c.vis)c.T.dom(c,T,dt);
  if(glOn){const W=canvas.clientWidth,H=canvas.clientHeight;renderer.getSize(_sz);if(_sz.x!==W||_sz.y!==H)resize();
    for(const c of chaps)if(c.vis&&c.s)c.T.gl(c,T,dt)}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- WebGL（three.js） ---------------- */
let THREE=null,renderer=null,env=null,_sz=null,_c=null;const G={};
const canvas=$('#gl');

function initGL(){
  _sz=new THREE.Vector2();_c=new THREE.Color();
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,MOB?1.5:1.6));
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
  renderer.autoClear=false;renderer.setScissorTest(true);resize();
  env=buildEnv();buildGeoms();
  for(const c of chaps)if(c.T.build)c.s=c.T.build(c.ch);
}
function resize(){if(renderer)renderer.setSize(canvas.clientWidth,canvas.clientHeight,false)}
addEventListener('resize',resize);
let bgCam=null;
function viewport(rect){const W=canvas.clientWidth,H=canvas.clientHeight,x=rect.left,y=H-(rect.top+rect.height),w=rect.width,h=rect.height;
  const sx=Math.max(0,x),sy=Math.max(0,y),sw=Math.min(W,x+w)-sx,sh=Math.min(H,y+h)-sy;if(sw<=0||sh<=0)return false;
  renderer.setViewport(x,y,w,h);renderer.setScissor(sx,sy,sw,sh);return true}
function draw(rect,clear,bg,scene,cam){if(!viewport(rect))return;
  renderer.setClearColor(_c.set(clear),1);renderer.clear(true,true,false);
  if(bg){bgCam=bgCam||new THREE.OrthographicCamera(-1,1,1,-1,0,1);bg.mat.uniforms.uAsp.value=rect.width/rect.height;bg.mat.uniforms.uT.value=T;renderer.render(bg.scene,bgCam)}
  if(scene){cam.aspect=rect.width/rect.height;cam.updateProjectionMatrix();renderer.render(scene,cam)}}
const look=(cam,x,y,z)=>cam.lookAt(x,y,z);
function stdScene(){const s=new THREE.Scene();s.environment=env;return s}
function keyLight(scene,col,i,pos){const l=new THREE.DirectionalLight(col,i);l.position.set(...pos);scene.add(l);return l}

/* 仮想スタジオ照明（映り込み用の環境マップ） */
function buildEnv(){const s=new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.BoxGeometry(12,12,12),new THREE.MeshBasicMaterial({color:new THREE.Color(.3,.3,.32),side:THREE.BackSide})));
  const panel=(w,h,pos,int,col=[1,1,1])=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(col[0]*int,col[1]*int,col[2]*int),side:THREE.DoubleSide}));m.position.set(...pos);m.lookAt(0,0,0);s.add(m)};
  panel(7,2.4,[0,5.8,0],9);panel(2.2,6,[-5.8,.6,1.4],6);panel(2.2,6,[5.8,.6,-1.2],3.2,[1,.92,.85]);panel(5,3,[0,1.2,5.8],2.2);panel(8,1,[0,-5.8,0],.6);
  const pm=new THREE.PMREMGenerator(renderer);const t=pm.fromScene(s,.035).texture;pm.dispose();return t}

/* 背景シェーダー：0=放射グラデ 1=ざらつき 2=光の玉 3=方眼 */
function makeBg(mode,a,b,c='#000'){
  const mat=new THREE.ShaderMaterial({depthTest:false,depthWrite:false,toneMapped:false,
    uniforms:{uA:{value:new THREE.Color(a)},uB:{value:new THREE.Color(b)},uC:{value:new THREE.Color(c)},uT:{value:0},uMode:{value:mode},uAsp:{value:1}},
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,
    fragmentShader:`uniform vec3 uA,uB,uC;uniform float uT,uMode,uAsp;varying vec2 vUv;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),u.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),u.x),u.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*n(p);p*=2.03;a*=.5;}return s;}
void main(){vec2 q=(vUv-.5)*vec2(uAsp,1.);vec3 col;
 if(uMode<.5){float d=length(q*vec2(.85,1.));col=mix(uA,uB,smoothstep(0.,1.05,d));}
 else if(uMode<1.5){float g=fbm(q*2.6)*.65+fbm(q*24.)*.35;col=mix(uA,uB,g);col*=1.-.28*smoothstep(.25,1.15,length(q));}
 else if(uMode<2.5){vec2 b1=vec2(-.32*uAsp+.08*sin(uT*.3),.18+.07*cos(uT*.25));vec2 b2=vec2(.28*uAsp+.08*cos(uT*.2),-.22+.05*sin(uT*.27));
   float f1=exp(-dot(q-b1,q-b1)*2.6),f2=exp(-dot(q-b2,q-b2)*2.2);col=uC;col=mix(col,uA,f1*.9);col=mix(col,uB,f2*.55);}
 else{col=mix(uA,uB,smoothstep(0.,1.2,length(q)));vec2 f=fract(q*10.);vec2 dd=min(f,1.-f);float l=1.-smoothstep(0.,.012,min(dd.x,dd.y));col=mix(col,uC,l*.18);}
 col+=(h(vUv*900.+fract(uT))-.5)*.018;gl_FragColor=vec4(col,1.);
 #include <colorspace_fragment>
}`});
  const s=new THREE.Scene(),q=new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat);q.frustumCulled=false;s.add(q);return{scene:s,mat}}

/* ---------------- 形（コードで作る商品） ---------------- */
function halfProfile(r,cy,top,n=20){const p=[];for(let i=0;i<=n;i++){const a=-Math.PI/2+i/n*Math.PI/2;p.push(new THREE.Vector2(Math.max(1e-4,Math.cos(a)*r),cy+Math.sin(a)*r))}p.push(new THREE.Vector2(r,top));return p}
function fullProfile(r,yc,n=20){const p=[];for(let i=0;i<=n;i++){const a=-Math.PI/2+i/n*Math.PI/2;p.push(new THREE.Vector2(Math.max(1e-4,Math.cos(a)*r),-yc+Math.sin(a)*r))}for(let i=1;i<=n;i++){const a=i/n*Math.PI/2;p.push(new THREE.Vector2(Math.max(1e-4,Math.cos(a)*r),yc+Math.sin(a)*r))}return p}
function buildGeoms(){
  G.body=new THREE.LatheGeometry(halfProfile(.5,-.87,.45),64);
  G.cap=new THREE.LatheGeometry(halfProfile(.518,-.87,.25),64);G.cap.rotateX(Math.PI);
  G.shell=new THREE.LatheGeometry(fullProfile(.532,.87),64);
  G.gran=new THREE.IcosahedronGeometry(1,1);
  G.bodyLo=new THREE.LatheGeometry(halfProfile(.5,-.87,.45,9),24);
  G.capLo=new THREE.LatheGeometry(halfProfile(.518,-.87,.25,9),24);G.capLo.rotateX(Math.PI);
  const bp=[[0,0],[.86,0],[.95,.02],[.99,.07],[1,.16],[1,2],[.985,2.14],[.93,2.27],[.8,2.38],[.62,2.45],[.5,2.49],[.49,2.56],[.49,2.62]];
  G.bottle=new THREE.LatheGeometry(bp.map(a=>new THREE.Vector2(Math.max(1e-4,a[0]),a[1])),96);
  G.bcap=new THREE.LatheGeometry([[.5,2.54],[.56,2.54],[.565,2.6],[.565,3.0],[.55,3.05],[1e-4,3.06]].map(a=>new THREE.Vector2(a[0],a[1])),96);
}
function rimMat(color,int=.8,pow=2.6){return new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,toneMapped:false,
  uniforms:{uC:{value:new THREE.Color(color)},uI:{value:int},uP:{value:pow}},
  vertexShader:`varying vec3 vN;varying vec3 vV;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`uniform vec3 uC;uniform float uI,uP;varying vec3 vN;varying vec3 vV;void main(){float f=pow(1.-clamp(abs(dot(normalize(vN),normalize(vV))),0.,1.),uP)*uI;gl_FragColor=vec4(uC*f,f);
 #include <colorspace_fragment>
}`})}
const capMat=c=>new THREE.MeshPhysicalMaterial({color:c,roughness:.22,clearcoat:1,clearcoatRoughness:.06,envMapIntensity:1.15});
const glassMat=(c,o,side)=>new THREE.MeshPhysicalMaterial({color:c,roughness:.06,transparent:true,opacity:o,clearcoat:1,clearcoatRoughness:.03,depthWrite:false,side,envMapIntensity:1.8});
function fillGranules(n,cols,full=false,sMin=.032,sMax=.072,geo=G.gran,mat){
  const m=new THREE.InstancedMesh(geo,mat||new THREE.MeshStandardMaterial({roughness:.62}),n);const d=new THREE.Object3D(),c=new THREE.Color();let i=0,guard=0;
  while(i<n&&guard<n*80){guard++;const x=(R()*2-1)*.44,z=(R()*2-1)*.44,y=full?lerp(-1.32,1.32,R()):lerp(-1.32,.42,R());
    const dy=Math.max(0,Math.abs(y)-.87);if(x*x+z*z+dy*dy>.43*.43)continue;
    d.position.set(x,y,z);d.rotation.set(R()*6,R()*6,R()*6);d.scale.setScalar(lerp(sMin,sMax,R()));d.updateMatrix();m.setMatrixAt(i,d.matrix);
    if(cols){c.set(cols[(R()*cols.length)|0]);c.offsetHSL(0,0,(R()-.5)*.08);m.setColorAt(i,c)}i++}
  m.count=i;m.instanceMatrix.needsUpdate=true;if(m.instanceColor)m.instanceColor.needsUpdate=true;return m}
/* カプセル（キャップ＋透明な本体＋中の粒＋縁の光） */
function makeCapsule(o={}){
  const g=new THREE.Group(),inner=new THREE.Group();g.add(inner);
  const cap=new THREE.Mesh(G.cap,capMat(o.cap||'#f2f0ea'));
  const back=new THREE.Mesh(G.body,glassMat(o.tint||'#ffffff',.16,THREE.BackSide));back.renderOrder=1;
  const front=new THREE.Mesh(G.body,glassMat(o.tint||'#ffffff',.3,THREE.FrontSide));front.renderOrder=2;
  inner.add(back,front,cap);
  if(o.n!==0){const gr=fillGranules(o.n||(MOB?200:320),o.gcols||['#ffffff','#e8e4ff']);inner.add(gr)}
  if(o.rim!==false){const s=new THREE.Mesh(G.shell,rimMat(o.rimColor||'#ffffff',o.rimI||.55));s.renderOrder=3;inner.add(s)}
  return{g,inner,cap,front,back}}
/* ラベル（文字を canvas に描いて巻き付ける） */
function labelTexture(L){const cv=document.createElement('canvas');cv.width=2048;cv.height=560;const x=cv.getContext('2d'),W=cv.width,H=cv.height;
  x.fillStyle=L.bg;x.fillRect(0,0,W,H);
  const r=mulberry32(9);for(let i=0;i<5000;i++){x.fillStyle=`rgba(255,255,255,${r()*.06})`;x.fillRect(r()*W,r()*H,2,2)}
  x.fillStyle=L.ink;x.fillRect(0,H*.08,W,H*.012);x.fillRect(0,H*.9,W,H*.012);
  x.textAlign='center';x.textBaseline='alphabetic';
  /* 正面から見えるのは周の約3分の1なので、文字は幅の3割以内に収める */
  if('letterSpacing' in x)x.letterSpacing='6px';x.font=`700 ${H*.11}px ${L.font||BR.display}`;x.fillText(L.title,W/2,H*.5);
  x.font=`500 ${H*.05}px ${BR.body}`;if('letterSpacing' in x)x.letterSpacing='12px';x.fillText(L.sub||'',W/2,H*.68);
  const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return{t,redraw:()=>{const n=labelTexture(L);t.image=n.t.image;t.needsUpdate=true}}}
/* ボトル：本体（ガラス）・ラベル・キャップ・中のカプセル をパーツとして返す */
function makeBottle(o){
  const g=new THREE.Group();
  const body=new THREE.Mesh(G.bottle,glassMat(o.glass||'#5a3a1e',o.glassOpacity||.55,THREE.DoubleSide));body.renderOrder=2;
  const lt=labelTexture(o.label);labelTexs.push(lt);
  const label=new THREE.Mesh(new THREE.CylinderGeometry(1.012,1.012,1.3,128,1,true,Math.PI,Math.PI*2),new THREE.MeshPhysicalMaterial({map:lt.t,roughness:.45,clearcoat:.4,clearcoatRoughness:.25}));
  label.geometry.translate(0,1.05,0);label.renderOrder=3;
  const cap=new THREE.Mesh(G.bcap,new THREE.MeshPhysicalMaterial({color:o.capColor||'#1b1d26',roughness:.35,metalness:.2,clearcoat:.6}));
  const capsG=new THREE.Group(),caps=[];
  const cA=capMat(o.capsule?.cap||'#9b8cf0'),cB=new THREE.MeshPhysicalMaterial({color:o.capsule?.tint||'#f4f2ff',roughness:.25,clearcoat:1});
  for(let i=0;i<(o.count||10);i++){const c=new THREE.Group();c.add(new THREE.Mesh(G.capLo,cA),new THREE.Mesh(G.bodyLo,cB));c.scale.setScalar(.3);
    const a=R()*6.28,rr=Math.sqrt(R())*.55;c.userData={x:Math.cos(a)*rr,y:.3+R()*1.3,z:Math.sin(a)*rr,rx:R()*3,rz:R()*3};
    c.position.set(c.userData.x,c.userData.y,c.userData.z);c.rotation.set(c.userData.rx,0,c.userData.rz);capsG.add(c);caps.push(c)}
  g.add(capsG,body,label,cap);
  return{g,o,parts:{body,label,cap,caps}}}
const labelTexs=[];
function makeProduct(key){const o=SITE.products[key];if(!o)throw new Error('products に '+key+' がありません');
  if(o.kind==='bottle')return makeBottle(o);
  throw new Error('未対応の形: '+o.kind)}
/* 背景を漂う小さなカプセル（奥行きを出す） */
function makeFloaters(N){const o=Object.values(SITE.products).find(p=>p.kind==='capsule')||{};
  const ci=new THREE.InstancedMesh(G.capLo,capMat(o.cap||BR.accent),N),bi=new THREE.InstancedMesh(G.bodyLo,new THREE.MeshPhysicalMaterial({color:o.tint||'#fff',roughness:.3,clearcoat:1}),N);
  const sd=[];for(let i=0;i<N;i++){const sx=(R()<.5?-1:1)*(2.6+R()*6);sd.push({x:sx,y:R()*9-3,z:-5-R()*9,v:.06+R()*.12,rx:R()*6,ry:R()*6,s:.16+R()*.14})}   /* 商品と文字の真後ろは避け、奥に置く */
  const g=new THREE.Group();g.add(ci,bi);return{g,ci,bi,sd,d:new THREE.Object3D()}}
function animFloaters(f,t){f.sd.forEach((s,i)=>{const y=((s.y+(RM?0:t*s.v)+3)%9+9)%9-3;
  f.d.position.set(s.x,y,s.z);f.d.rotation.set(s.rx+t*.2,s.ry+t*.15,0);f.d.scale.setScalar(s.s);f.d.updateMatrix();f.ci.setMatrixAt(i,f.d.matrix);f.bi.setMatrixAt(i,f.d.matrix)});
  f.ci.instanceMatrix.needsUpdate=f.bi.instanceMatrix.needsUpdate=true}
function shadowTex(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const g=x.createRadialGradient(128,128,0,128,128,128);g.addColorStop(0,'rgba(0,0,0,.55)');g.addColorStop(.5,'rgba(0,0,0,.22)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,256,256);return new THREE.CanvasTexture(c)}
let SHT;function shadow(w,d){SHT=SHT||shadowTex();const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshBasicMaterial({map:SHT,transparent:true,depthWrite:false,toneMapped:false}));m.rotation.x=-Math.PI/2;return m}

/* 曲線に沿って流れるカプセル（cta などで使用） */
function makeLUT(pts,n=600){const cv=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)));const P=[],Tn=[];for(let i=0;i<=n;i++){P.push(cv.getPointAt(i/n));Tn.push(cv.getTangentAt(i/n))}return{P,Tn,n}}
function lutAt(L,u){const f=clamp(u)*L.n,i=Math.min(L.n-1,Math.floor(f)),k=f-i;return[L.P[i].clone().lerp(L.P[i+1],k),L.Tn[i].clone().lerp(L.Tn[i+1],k).normalize()]}
function makeStream(N,capC,bodyC){
  const ci=new THREE.InstancedMesh(G.capLo,new THREE.MeshPhysicalMaterial({roughness:.24,clearcoat:1,clearcoatRoughness:.07}),N);
  const bi=new THREE.InstancedMesh(G.bodyLo,new THREE.MeshPhysicalMaterial({roughness:.3,clearcoat:1,clearcoatRoughness:.1}),N);
  ci.instanceMatrix.setUsage(THREE.DynamicDrawUsage);bi.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const seeds=[];for(let i=0;i<N;i++)seeds.push({u:i/N+(R()-.5)/N,a:R()*6.28,r:Math.sqrt(R()),roll:R()*6.28,s:.5+R()*.25,v:R()});
  for(let i=0;i<N;i++){ci.setColorAt(i,new THREE.Color(capC(seeds[i])));bi.setColorAt(i,new THREE.Color(bodyC(seeds[i])))}
  const g=new THREE.Group();g.add(ci,bi);return{g,ci,bi,seeds,N,d:new THREE.Object3D(),up:new THREE.Vector3(0,1,0),n:new THREE.Vector3(),b:new THREE.Vector3(),q:new THREE.Quaternion()}}
function layStream(st,L,{flow=0,reveal=1,radius=.5,scale=1}){
  const{d,up,n,b,q}=st;
  for(let i=0;i<st.N;i++){const sd=st.seeds[i];let u=(sd.u+flow)%1;if(u<0)u+=1;
    const[P,Tg]=lutAt(L,u);n.set(0,0,1).cross(Tg);if(n.lengthSq()<1e-4)n.set(1,0,0);n.normalize();b.copy(Tg).cross(n).normalize();
    const rr=sd.r*radius;d.position.copy(P).addScaledVector(n,Math.cos(sd.a)*rr).addScaledVector(b,Math.sin(sd.a)*rr);
    d.quaternion.setFromUnitVectors(up,Tg);q.setFromAxisAngle(Tg,sd.roll);d.quaternion.premultiply(q);
    const vis=u<=reveal?1:0,edge=clamp((reveal-u)*20);d.scale.setScalar(sd.s*scale*vis*(.3+.7*edge));d.updateMatrix();
    st.ci.setMatrixAt(i,d.matrix);st.bi.setMatrixAt(i,d.matrix)}
  st.ci.instanceMatrix.needsUpdate=st.bi.instanceMatrix.needsUpdate=true}

/* ---------------- 起動（すべての関数・定数を定義し終えてから three.js を読む） ---------------- */
try{THREE=await import('three')}catch(e){}
if(THREE){try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'})}catch(e){renderer=null}}
if(!renderer)document.documentElement.classList.add('no-gl');
else{try{initGL();glOn=true}catch(e){console.error(e);renderer=null;document.documentElement.classList.add('no-gl')}}
/* フォント読込後にラベルを描き直す（明朝などがcanvasに反映されるように） */
if(document.fonts&&renderer)document.fonts.ready.then(()=>labelTexs.forEach(l=>l.redraw()));

</script>
