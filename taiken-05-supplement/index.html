<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NIGHT MONSTER｜スクロールで分解する（体験デモ）</title>
<meta name="description" content="スクロールすると商品が空中でほどけ、中身が見える体験型サイトのデモ。GROWX 体験カタログ 05。">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070A14">
<link rel="preload" href="assets/mincho.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ===== 05：1つの夜のスタジオの中で、カメラと物だけが動く（体験型）=====
   ・画面いっぱいに固定した3D（canvas）1枚。文字は3Dの物に付く形で重ねる
   ・外部サーバーに頼らない（three.js とフォントは assets/ 内。フォントは使う文字だけに軽量化）
   ・文字14px以上／コントラスト4.5:1以上／ボタン48px以上／横スクロール0 */
@font-face{font-family:"NM Mincho";src:url(assets/mincho.woff2) format("woff2");font-weight:700;font-display:swap}
:root{
  --gutter:clamp(16px,4.5vw,40px);
  --bg:#070A14; --ink:#F3F1EA; --muted:#B9BECC; --gold:#E2C27A; --gold-ink:#1C1505;
  --panel:rgba(10,14,28,.78); --line:rgba(255,255,255,.16);
  --display:"NM Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{max-width:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.track{position:relative;height:820vh}           /* スクロールの長さ＝体験の尺 */
#touch{position:fixed;inset:0;z-index:1;touch-action:pan-y;cursor:grab}   /* 指の操作を受ける透明な層（縦はスクロールのまま） */
#touch.drag{cursor:grabbing}
.ui{position:fixed;inset:0;z-index:2;pointer-events:none}
.ui .on{pointer-events:auto}

/* ヘッダー */
.brand{position:fixed;z-index:3;top:calc(env(safe-area-inset-top,0px) + 16px);left:var(--gutter);font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.22em;pointer-events:none}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:14px;letter-spacing:.16em;color:var(--muted)}
.steps{position:fixed;z-index:3;top:calc(env(safe-area-inset-top,0px) + 24px);right:var(--gutter);display:flex;gap:6px;pointer-events:none}
.steps i{display:block;width:22px;height:2px;border-radius:2px;background:rgba(255,255,255,.28);transition:background .4s}
.steps i.on{background:var(--ink)}

/* 読み込み中：ブランド名を光がなぞる（何も出ない時間を作らない） */
#loader{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--bg);transition:opacity .9s,visibility .9s}
#loader.done{opacity:0;visibility:hidden}
#loader b{position:relative;display:block;overflow:hidden;font-family:var(--display);font-weight:700;font-size:clamp(28px,7vw,52px);letter-spacing:.2em;color:#B89A55}   /* 文字は最初から見える色で描く（表示速度の計測で「表示された」と数えられるように） */
#loader b::after{content:"";position:absolute;inset:0 -60%;background:linear-gradient(100deg,transparent 42%,rgba(255,244,214,.75) 50%,transparent 58%);mix-blend-mode:overlay;animation:sweep 2.2s ease-in-out infinite}
@keyframes sweep{from{transform:translateX(-35%)}to{transform:translateX(35%)}}

/* 操作のヒント */
.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;
  padding:10px 18px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;color:var(--ink);white-space:nowrap;opacity:0;transition:opacity .2s}
.hint i{width:2px;height:16px;background:var(--ink);border-radius:2px;animation:drip 1.6s ease-in-out infinite}
@keyframes drip{0%{transform:translateY(-4px);opacity:0}40%{opacity:1}100%{transform:translateY(6px);opacity:0}}
.hint.crack i{width:24px;height:2px;animation:pull 1.4s ease-in-out infinite}
@keyframes pull{0%,100%{transform:scaleX(.4)}50%{transform:scaleX(1.3)}}

/* 説明線（3Dのパーツに付く） */
.callout{position:fixed;left:0;top:0;display:flex;align-items:center;gap:8px;opacity:0;will-change:transform,opacity}
.callout::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ink);flex:none;box-shadow:0 0 0 4px rgba(243,241,234,.14)}
.callout i{display:block;width:clamp(16px,3vw,40px);height:1px;background:rgba(243,241,234,.7);flex:none;transform-origin:left}   /* 金はUIの1か所（ボタンか数字）だけ */
.callout b{display:block;font-family:var(--display);font-weight:700;font-size:16px;line-height:1.5;white-space:nowrap;text-shadow:0 1px 12px rgba(0,0,0,.8)}
.callout span{display:block;font-size:14px;line-height:1.5;color:var(--muted);white-space:nowrap;text-shadow:0 1px 12px rgba(0,0,0,.8)}

/* 成分表示を読む（ラベルの上に重ねる） */
.read{position:fixed;left:0;top:0;opacity:0;padding:14px 18px;border-radius:14px;background:var(--panel);border:1px solid rgba(226,194,122,.5);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);will-change:transform,opacity;min-width:200px}
.read small{display:block;font-size:14px;color:var(--muted)}
.read b{display:block;font-family:var(--display);font-weight:700;font-size:18px;margin-top:2px}
.read .amt{font-family:var(--display);font-weight:700;font-size:clamp(40px,7vw,56px);line-height:1.1;color:var(--gold);font-variant-numeric:tabular-nums}
.read .amt small{display:inline;font-family:var(--body);font-size:18px;color:var(--gold);margin-left:4px}

/* 終点 */
.finale{position:fixed;left:var(--gutter);right:var(--gutter);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;opacity:0;transform:translateY(16px);transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1)}
.finale.show{opacity:1;transform:none}
.finale p{margin:0;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.06em;text-shadow:0 1px 14px rgba(0,0,0,.8)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 30px;border-radius:999px;border:0;background:var(--gold);color:var(--gold-ink);
  font:700 16px/1.2 var(--body);cursor:pointer;white-space:nowrap;box-shadow:0 10px 30px rgba(226,194,122,.25);transition:transform .15s}
@media (hover:hover){.btn:hover{transform:translateY(-2px)}}
.btn:active{transform:translateY(1px) scale(.98)}
.btn:focus-visible{outline:3px solid #FFE9B0;outline-offset:3px}
.finale small{font-size:14px;color:var(--muted);max-width:30em;line-height:1.6}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-10px);z-index:20;opacity:0;width:max-content;max-width:calc(100% - 2*var(--gutter));
  background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;transition:.35s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 3Dが使えない端末：文字だけで中身を伝える */
.nogl{display:none}
html.no-gl .nogl{display:grid;position:fixed;inset:0;z-index:5;place-content:center;gap:12px;padding:0 var(--gutter);text-align:center;
  background:radial-gradient(ellipse 70% 60% at 50% 40%,#1B2440,var(--bg))}
html.no-gl .nogl ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;color:var(--muted)}
html.no-gl .nogl .btn{justify-self:center;pointer-events:auto}
html.no-gl #touch,html.no-gl .hint{display:none}

@media (prefers-reduced-motion:reduce){#loader b::after,.hint i{animation:none}.finale,.hint,#loader{transition:none}}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="track" id="track" aria-hidden="true"></div>
<div id="touch" aria-hidden="true"></div>

<div class="brand">NIGHT MONSTER<small>SLEEP SUPPORT</small></div>
<div class="steps" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i></div>

<div class="ui" aria-live="polite">
  <div class="hint" id="hint"><i></i><span id="hintText">スクロールでほどける ／ 指で回せます</span></div>
  <div class="callout" data-k="cap"><i></i><span><b>二重キャップ</b><span>湿気を遮断</span></span></div>
  <div class="callout" data-k="label"><i></i><span><b>遮光ラベル</b><span>成分の劣化を防ぐ</span></span></div>
  <div class="callout" data-k="caps"><i></i><span><b>1日2粒</b><span>GABA 100mg</span></span></div>
  <div class="callout" data-k="base"><i></i><span><b>製造ロット</b><span>全数追跡</span></span></div>
  <div class="read" id="read"><small>1日2粒あたり</small><b>GABA</b><div class="amt" id="amt">0<small>mg</small></div></div>
  <div class="finale" id="finale">
    <p>中身を見た上で</p>
    <button class="btn on" type="button" id="buy">定期 ¥5,980 で始める</button>
    <small class="jw">このページは、GROWXの体験型サイトのデモです。商品名・配合量・価格はすべて架空のものです。</small>
  </div>
</div>

<div class="nogl">
  <b style="font-family:var(--display);font-size:28px;letter-spacing:.2em">NIGHT MONSTER</b>
  <ul><li>二重キャップ・湿気を遮断</li><li>遮光ラベル・成分の劣化を防ぐ</li><li>1日2粒・GABA 100mg</li><li>製造ロット・全数追跡</li></ul>
  <p style="margin:8px 0 0">中身を見た上で</p>
  <button class="btn" type="button" id="buy2">定期 ¥5,980 で始める</button>
</div>

<div id="loader" aria-hidden="true"><b>NIGHT MONSTER</b></div>
<div class="toast" id="toast" role="status">デモのため、申込みは行われません。</div>

<script type="module">
/* ---------- 共通の道具 ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, seg=(p,a,b)=>clamp((p-a)/(b-a));
const io3=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, o3=t=>1-Math.pow(1-t,3);
const bell=(p,a,b,f=.04)=>Math.min(seg(p,a,a+f),1-seg(p,b-f,b));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOB=Math.min(innerWidth,innerHeight)<700;
function rnd(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rnd(11);

/* 申込み：送信しない（表示のみ） */
const toastEl=$('#toast');let tt;
function demo(){toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),2400)}
$('#buy').addEventListener('click',demo);$('#buy2').addEventListener('click',demo);

/* 一度開いた端末では、電波がなくても開けるようにする */
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

/* 3Dの準備は、最初の画面（ブランド名）を描き終えてから始める */
if(document.readyState!=='complete')await new Promise(r=>addEventListener('load',r,{once:true}));
await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(r,120))));   /* 2回描画を待つ＝ブランド名が確実に画面に出てから */
const yieldNow=()=>new Promise(r=>setTimeout(r,0));   /* 重い準備を小分けにして、画面を止めない */
let THREE;
try{THREE=await import('./assets/three.module.min.js')}catch(e){}
let renderer=null;
if(THREE){try{renderer=new THREE.WebGLRenderer({canvas:$('#gl'),antialias:!(MOB&&devicePixelRatio>=2),powerPreference:'high-performance'})}catch(e){renderer=null}}
if(!renderer){document.documentElement.classList.add('no-gl');$('#loader').classList.add('done')}
else await start();

async function start(){
/* ---------- 描画の土台 ---------- */
/* GPUがない環境（ソフトウェア描画）では、画質と粒の数を下げて軽くする */
let LOW=false;try{const gl=renderer.getContext(),ext=gl.getExtension('WEBGL_debug_renderer_info');const name=ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):'';LOW=/swiftshader|llvmpipe|software/i.test(name)}catch(e){}
renderer.setPixelRatio(LOW?1:Math.min(devicePixelRatio||1,MOB?1.5:1.75));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
const scene=new THREE.Scene();scene.background=new THREE.Color('#070A14');scene.fog=new THREE.Fog('#070A14',14,34);
const cam=new THREE.PerspectiveCamera(32,1,.1,80);

/* 仮想の撮影スタジオ照明（映り込み用）：上から大きなソフトボックス、左右に細い縦の光 */
if(!LOW){const s=new THREE.Scene();s.add(new THREE.Mesh(new THREE.BoxGeometry(12,12,12),new THREE.MeshBasicMaterial({color:new THREE.Color(.02,.025,.05),side:THREE.BackSide})));
 const panel=(w,h,pos,int,c=[1,.95,.85])=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(c[0]*int,c[1]*int,c[2]*int),side:THREE.DoubleSide}));m.position.set(...pos);m.lookAt(0,0,0);s.add(m)};
 panel(5,5,[0,5.8,0],7);panel(1.2,7,[-5.8,1,1],5);panel(1.2,7,[5.8,1,-1],3,[.8,.85,1]);panel(4,2,[0,1,5.8],1.2);
 const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(s,.03).texture;pm.dispose();}
else scene.add(new THREE.HemisphereLight('#C8D2FF','#1A1408',1.4));   /* GPUなし：映り込みを省き、空の光で代用 */
await yieldNow();
const key=new THREE.DirectionalLight('#FFF1D6',2.2);key.position.set(-2,9,5);scene.add(key);
const rim=new THREE.DirectionalLight('#9DB0FF',1.0);rim.position.set(4,3,-6);scene.add(rim);
scene.add(new THREE.AmbientLight('#1A2140',.6));

/* キャンバスで小さなテクスチャを作る道具 */
function cvTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const radial=(stops)=>cvTex(256,256,(x,w,h)=>{const g=x.createRadialGradient(128,128,0,128,128,128);stops.forEach(s=>g.addColorStop(s[0],s[1]));x.fillStyle=g;x.fillRect(0,0,w,h)});

/* 床：映り込まない濃紺の床（見本どおり）と、スポットライトの光だまり */
const floor=new THREE.Mesh(new THREE.CircleGeometry(30,64),new THREE.MeshStandardMaterial({color:'#0B1020',roughness:.9,metalness:0,envMapIntensity:.15}));
floor.rotation.x=-Math.PI/2;scene.add(floor);
const pool=new THREE.Mesh(new THREE.PlaneGeometry(9,9),new THREE.MeshBasicMaterial({map:radial([[0,'rgba(255,226,170,.30)'],[.45,'rgba(255,214,150,.10)'],[1,'rgba(0,0,0,0)']]),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,toneMapped:false}));
pool.rotation.x=-Math.PI/2;pool.position.y=.005;scene.add(pool);
/* 背景：後ろの壁にぼんやりした光（ホリゾント） */
const wall=new THREE.Mesh(new THREE.PlaneGeometry(40,20),new THREE.MeshBasicMaterial({map:radial([[0,'rgba(24,30,56,1)'],[.55,'rgba(9,12,24,1)'],[1,'rgba(5,7,14,1)']]),toneMapped:false,fog:false}));
wall.position.set(0,6,-12);scene.add(wall);
/* スポットライトの光の筋（上から差す円すい。加算で淡く） */
/* 見本（plan/05-kv/out）：光の筋は上ほど明るく、台座の幅まで広がる。外側の広い円すい＋内側の芯の2重 */
const beamTex=cvTex(64,256,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(255,232,190,.13)');g.addColorStop(.35,'rgba(255,232,190,.06)');g.addColorStop(.8,'rgba(255,232,190,.02)');g.addColorStop(1,'rgba(255,232,190,0)');x.fillStyle=g;x.fillRect(0,0,w,h)});
const beamM=new THREE.MeshBasicMaterial({map:beamTex,transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,toneMapped:false});
const beam=new THREE.Mesh(new THREE.CylinderGeometry(.5,2.4,9,48,1,true),beamM);
beam.position.y=4.6;scene.add(beam);
const beamCore=new THREE.Mesh(new THREE.CylinderGeometry(.18,1.1,9,32,1,true),beamM);beamCore.position.y=4.6;scene.add(beamCore);

/* 台座：低い円柱と金の縁 */
const ped=new THREE.Group();scene.add(ped);
const pedM=new THREE.MeshStandardMaterial({color:'#1A2342',roughness:.5,metalness:.2});
ped.add(new THREE.Mesh(new THREE.CylinderGeometry(1.7,1.75,.28,96),pedM));
const ring=new THREE.Mesh(new THREE.TorusGeometry(1.7,.012,8,160),new THREE.MeshBasicMaterial({color:'#A8905A',toneMapped:false}));   /* 金はUIの1か所に絞るため、台座の縁は落ち着いた色に */ring.rotation.x=Math.PI/2;ring.position.y=.14;ped.add(ring);
ped.position.y=.14;
const shadow=new THREE.Mesh(new THREE.PlaneGeometry(3.2,3.2),new THREE.MeshBasicMaterial({map:radial([[0,'rgba(0,0,0,.65)'],[.5,'rgba(0,0,0,.25)'],[1,'rgba(0,0,0,0)']]),transparent:true,depthWrite:false}));
shadow.rotation.x=-Math.PI/2;shadow.position.y=.285;scene.add(shadow);
await yieldNow();

/* ---------- 商品（すべてコードで作る） ---------- */
const V=(x,y)=>new THREE.Vector2(Math.max(1e-4,x),y);
const glassM=new THREE.MeshPhysicalMaterial({color:'#7A4A22',roughness:.08,transparent:true,opacity:.62,clearcoat:1,clearcoatRoughness:.04,envMapIntensity:1.8,side:THREE.DoubleSide,depthWrite:true});
const bodyGeo=new THREE.LatheGeometry([[.97,.14],[.99,.18],[1,.3],[1,2],[.985,2.14],[.93,2.27],[.8,2.38],[.62,2.45],[.5,2.49],[.49,2.56],[.49,2.62]].map(a=>V(a[0],a[1])),96);
const baseGeo=new THREE.LatheGeometry([[0,0],[.86,0],[.95,.02],[.99,.07],[1,.15],[.97,.16],[0,.16]].map(a=>V(a[0],a[1])),96);
const capGeo=new THREE.LatheGeometry([[.5,2.54],[.56,2.54],[.565,2.6],[.565,3.0],[.55,3.05],[0,3.06]].map(a=>V(a[0],a[1])),96);
const ridge=cvTex(512,16,(x)=>{for(let i=0;i<512;i+=8){x.fillStyle='#fff';x.fillRect(i,0,4,16);x.fillStyle='#000';x.fillRect(i+4,0,4,16)}});ridge.wrapS=THREE.RepeatWrapping;ridge.repeat.set(12,1);
/* ラベル：表に商品名、裏に成分表示（すべて架空） */
let labelCanvas,labelTex=null;
/* ラベルは同じ配置で2枚描く：①見た目の色 ②質感（緑＝ざらつき・青＝金属感）。
   金の紙は少し金属的な艶（箔）、墨の文字はマットな紙（DESIGN.md 6章） */
let maskCanvas,maskTex=null;
function drawLabel(){drawLabelTo(false);drawLabelTo(true)}
function drawLabelTo(mask){
  const c=mask?(maskCanvas||(maskCanvas=document.createElement('canvas'))):(labelCanvas||(labelCanvas=document.createElement('canvas')));
  c.width=2048;c.height=640;const x=c.getContext('2d'),W=c.width,H=c.height;
  if(mask){x.fillStyle='rgb(0,88,95)';x.fillRect(0,0,W,H)}
  else{const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#F0D38A');g.addColorStop(1,'#D6AE5C');x.fillStyle=g;x.fillRect(0,0,W,H);
    const r=rnd(5);for(let i=0;i<1500;i++){x.fillStyle=`rgba(255,255,255,${r()*.05})`;x.fillRect(r()*W,r()*H,2,2)}}
  x.fillStyle=mask?'rgb(0,220,0)':'#1B1505';x.fillRect(0,H*.07,W,4);x.fillRect(0,H*.92,W,4);
  const M='"NM Mincho","Hiragino Mincho ProN",serif', S='"Hiragino Sans","Noto Sans JP",sans-serif';
  /* 表（中央）：正面から見えるのは周の約3分の1なので、幅の3割に収める */
  x.textAlign='center';x.font=`700 ${H*.12}px ${M}`;if('letterSpacing' in x)x.letterSpacing='8px';x.fillText('NIGHT MONSTER',W*.5,H*.46);

  for(let j=0;j<3;j++){let v=lerp(far[j],wide[j],A),l=lerp(lookF[j],lookW[j],A);v=lerp(v,crackC[j],H);l=lerp(l,lookC[j],H);v=lerp(v,readC[j],Rd);l=lerp(l,lookR[j],Rd);cp[j]=v;lk[j]=l}
  cam.position.set(cp[0],cp[1],cp[2]);cam.lookAt(lk[0],lk[1],lk[2]);
  beamM.opacity=(1-.5*H)*dip;key.intensity=2.2*dip;
  if(dust){const pa=dust.geometry.attributes.position;dust.userData.sd.forEach((d,i)=>{d.y+=d.v*dt*.25;if(d.y>7.6)d.y=.6;
      const a=d.a+Math.sin(T*.2+d.ph)*.3;pa.setXYZ(i,Math.cos(a)*d.r,d.y,Math.sin(a)*d.r)});pa.needsUpdate=true;dust.material.opacity=.45*(1-.6*H)*(1-.6*Rd)*dip}
  glow.material.opacity=Rd*(.09+.04*Math.sin(T*3));   /* 成分表示の「GABA」の行を光らせる */

  draw(lk,dt);

  /* ---- 文字の重ね ---- */
  right.set(1,0,0).applyQuaternion(cam.quaternion);
  const AN={cap:[P.cap,2.8,.62,0],label:[P.label,1.1,1.1,2],caps:[bottle,3.35,1.85,1],base:[P.base,.08,1.05,3]};
  for(const k in notes){const n=notes[k],a=AN[k],vis=o3(seg(p,.2+a[3]*.012,.24+a[3]*.012))*(1-seg(p,.33,.37));   /* 上から順に、素早く出てゆっくり止まる */
    vtmp.set(0,a[1],0);a[0].localToWorld(vtmp);vtmp.addScaledVector(right,a[2]);
    const[x,y]=toScreen(vtmp),w=n.offsetWidth,flip=x+w>innerWidth-16;   /* 右がはみ出すなら左側に出す */
    n.style.flexDirection=flip?'row-reverse':'row';n.style.textAlign=flip?'right':'left';
    n.style.transform=`translate(${flip?x-w+4:x-4}px,${y}px) translateY(-50%)`;n.style.opacity=vis;n.querySelector('i').style.transform=`scaleX(${vis})`}
  /* 読む：ラベル背面の光る行の横にパネル */
  if(Rd>.01){glowPt.getWorldPosition(vtmp);const[x,y]=toScreen(vtmp),w=readEl.offsetWidth,h=readEl.offsetHeight;
    const rx=pt?clamp(x-w/2,16,innerWidth-w-16):Math.min(x+innerWidth*.2,innerWidth-w-24),ry=pt?Math.min(y+innerHeight*.3,innerHeight-h-24):y-h/2;   /* ラベルの文字に重ならない位置 */
    readEl.style.transform=`translate(${rx}px,${ry}px)`;readEl.style.opacity=seg(Rd,.6,1);if(Rd>.7)countUp()}
  else{readEl.style.opacity=0;if(p<.55&&counted){counted=false;amtEl.innerHTML='0<small>mg</small>'}}

  /* ヒント・終点・進み具合 */
  const showHint=p<.05?1:(inCrack()&&H>.9&&crack<.5?1:0),mode=inCrack()?'crack':'top';
  if(mode!==hintMode){hintMode=mode;hint.classList.toggle('crack',mode==='crack');hintText.textContent=mode==='crack'?'指で左右に引いて、割る':'スクロールでほどける ／ 指で回せます'}
  hint.style.opacity=showHint;
  finale.classList.toggle('show',F>=1);
  steps.forEach((e,i)=>e.classList.toggle('on',i<=st));

  if(first){first=false;requestAnimationFrame(()=>$('#loader').classList.add('done'))}
  requestAnimationFrame(frame);
}
/* 本物の素材（CC0）：撮影スタジオの映り込み・ガラスのくもり・紙の繊維・石の凹凸。最初の画面のあとに読む */
if(!LOW){const L=new THREE.TextureLoader(),ld=u=>new Promise(r=>L.load(u,r,undefined,()=>r(null)));
  Promise.all(['assets/env-studio.jpg','assets/glass-rough.jpg','assets/paper-normal.jpg','assets/stone-normal.jpg','assets/stone-rough.jpg'].map(ld)).then(([env,gr,pn,sn,sr])=>{
    if(env){env.mapping=THREE.EquirectangularReflectionMapping;env.colorSpace=THREE.SRGBColorSpace;const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromEquirectangular(env).texture;pm.dispose();env.dispose()}
    if(gr){glassM.roughnessMap=gr;glassM.roughness=.42;glassM.needsUpdate=true}
    if(pn){pn.wrapS=pn.wrapT=THREE.RepeatWrapping;pn.repeat.set(6,2);P.label.material.normalMap=pn;P.label.material.normalScale.set(.5,.5);P.label.material.needsUpdate=true}
    if(sn&&sr){[sn,sr].forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,2)});pedM.normalMap=sn;pedM.normalScale.set(.5,.5);pedM.roughnessMap=sr;pedM.roughness=.7;pedM.needsUpdate=true}
    dirty=true});}
/* GPUのない端末：質感の計算が重い素材を、軽い素材に置き換える（色・模様・透明度はそのまま） */
if(LOW){const cache=new Map();scene.traverse(o=>{const m=o.material;if(!m||!(m.isMeshStandardMaterial))return;
  if(!cache.has(m))cache.set(m,new THREE.MeshLambertMaterial({color:m.color,map:m.map||null,transparent:m.transparent,opacity:m.opacity,side:m.side,depthWrite:m.depthWrite}));
  o.material=cache.get(m)});
  const gm=cache.get(glassM);if(gm)Object.defineProperty(glassM,'opacity',{set(v){gm.opacity=v},get(){return gm.opacity}});   /* ほどける時の透け具合を引き継ぐ */
  renderer.setPixelRatio(.75)}
try{if(renderer.compileAsync)await renderer.compileAsync(scene,cam)}catch(e){}   /* 描画の準備（シェーダー）を、画面を止めずに済ませる */
requestAnimationFrame(frame);
}
