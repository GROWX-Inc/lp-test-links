<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ハコブネ物流｜御社の荷物が届く（体験デモ）</title>
<meta name="description" content="社名を入れると、その名前の箱がミニチュアの街を集荷から納品まで運ばれていく体験型サイトのデモ。GROWX 体験カタログ 06。">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EFE8DA">
<link rel="preload" href="assets/mincho.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ===== 06：1つのミニチュアの街の中で、カメラが社名入りの箱を追う（体験型）=====
   気分：几帳面・あたたかい・確実／色：生成り＋藍（アクセント1色）／光：時刻に合わせて朝→昼→午後
   外部サーバーに頼らない（three.js とフォントは assets/ 内）。文字14px以上・ボタン48px以上・横スクロール0 */
@font-face{font-family:"HK Mincho";src:url(assets/mincho.woff2) format("woff2");font-weight:700;font-display:swap}
:root{
  --gutter:clamp(16px,4.5vw,40px);
  --paper:#EFE8DA; --ink:#1E2433; --muted:#4E5566; --accent:#2E4A86; --accent-ink:#FFFFFF;
  --panel:rgba(250,247,240,.9); --line:rgba(30,36,51,.16);
  --display:"HK Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{max-width:100%;overflow:hidden;height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
/* ミニチュア感：画面の上下だけを少しぼかす（手前と奥がぼける模型写真の見え方） */
.tilt{position:fixed;left:0;right:0;pointer-events:none;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.tilt.t{top:0;height:24%;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.tilt.b{bottom:0;height:20%;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
html.low .tilt{display:none}

.brand{position:fixed;z-index:3;top:calc(env(safe-area-inset-top,0px) + 16px);left:var(--gutter);font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.2em;color:var(--ink)}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:14px;letter-spacing:.08em;color:var(--muted)}
.clock{position:fixed;z-index:3;top:calc(env(safe-area-inset-top,0px) + 16px);right:var(--gutter);text-align:right;font-variant-numeric:tabular-nums}
.clock small{display:block;font-size:14px;color:var(--muted);letter-spacing:.08em}
.clock b{display:block;font-family:var(--display);font-size:24px;line-height:1.2}

/* 出荷：社名を入れる */
.ship{position:fixed;z-index:4;left:var(--gutter);right:var(--gutter);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);max-width:520px;margin:0 auto;
  padding:16px;border-radius:16px;background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:grid;gap:10px;transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1)}
.ship.out{opacity:0;transform:translateY(20px);pointer-events:none}
.ship label{font-size:14px;color:var(--muted)}
.ship form{display:flex;gap:8px}
.ship input{flex:1;min-width:0;min-height:52px;padding:0 14px;border-radius:12px;border:1px solid rgba(30,36,51,.3);background:#fff;color:var(--ink);font:16px var(--body)}
.ship input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 26px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);
  font:700 16px/1.2 var(--body);cursor:pointer;white-space:nowrap;transition:transform .2s cubic-bezier(.22,1,.36,1)}
@media (hover:hover){.btn:hover{transform:translateY(-2px)}}
.btn:active{transform:translateY(1px) scale(.98)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid rgba(30,36,51,.35)}

/* 地点の札（3Dの地点に付く） */
.tag{position:fixed;left:0;top:0;z-index:2;padding:6px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);white-space:nowrap;
  opacity:0;transform:translate(-50%,-100%);transition:opacity .4s;font-variant-numeric:tabular-nums;pointer-events:none}
.tag b{display:block;font-family:var(--display);font-size:16px;line-height:1.3}
.tag span{display:block;font-size:14px;color:var(--muted);line-height:1.4}
.tag.on{opacity:1}
.tag.on b{color:var(--accent)}

/* 記録（左下） */
.log{position:fixed;z-index:2;left:var(--gutter);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:grid;gap:2px;font-size:14px;font-variant-numeric:tabular-nums;pointer-events:none}
.log p{margin:0;opacity:0;transform:translateX(-8px);transition:opacity .4s cubic-bezier(.22,1,.36,1),transform .4s cubic-bezier(.22,1,.36,1);text-shadow:0 1px 0 rgba(255,255,255,.7)}
.log p.on{opacity:1;transform:none}
.log p b{display:inline-block;min-width:3.4em;font-weight:700}

/* 受領印を押す */
.stampBtn{position:fixed;z-index:4;left:0;top:0;width:104px;height:104px;border-radius:50%;border:3px solid #B3322B;background:rgba(255,255,255,.92);color:#B3322B;
  font-family:var(--display);font-weight:700;font-size:16px;line-height:1.3;cursor:pointer;display:grid;place-items:center;text-align:center;
  opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.8);transition:opacity .3s,transform .3s cubic-bezier(.22,1,.36,1)}
.stampBtn.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(179,50,43,.12)}}
.stampBtn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* 終点 */
.finale{position:fixed;z-index:4;left:var(--gutter);right:var(--gutter);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
  opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1)}
.finale.show{opacity:1;transform:none;pointer-events:auto}
.finale p{margin:0;font-family:var(--display);font-weight:700;font-size:20px;text-shadow:0 1px 0 rgba(255,255,255,.8)}
.finale .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.finale small{font-size:14px;color:var(--muted);max-width:32em;line-height:1.6}

/* 見積フォーム（送信しない） */
.modal{position:fixed;inset:0;z-index:8;display:grid;place-items:center;padding:var(--gutter);background:rgba(30,36,51,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.modal.show{opacity:1;pointer-events:auto}
.sheet{width:min(440px,100%);background:#FBF8F2;border-radius:16px;padding:22px;display:grid;gap:14px;box-shadow:0 20px 50px rgba(30,36,51,.25)}
.sheet h2{margin:0;font-family:var(--display);font-size:20px}
.sheet label{display:grid;gap:6px;font-size:14px;color:var(--muted)}
.sheet input,.sheet select{width:100%;min-height:52px;padding:0 12px;border-radius:12px;border:1px solid rgba(30,36,51,.3);background:#fff;color:var(--ink);font:16px var(--body)}
.sheet .acts{display:flex;gap:10px;flex-wrap:wrap}
.sheet p{margin:0;font-size:14px;color:var(--muted)}

#loader{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--paper);transition:opacity .8s,visibility .8s}
#loader.done{opacity:0;visibility:hidden}
#loader b{position:relative;display:block;overflow:hidden;font-family:var(--display);font-size:clamp(26px,6vw,44px);letter-spacing:.22em;color:#6E6A60}
#loader b::after{content:"";position:absolute;inset:0 -60%;background:linear-gradient(100deg,transparent 42%,rgba(255,255,255,.85) 50%,transparent 58%);animation:sweep 2s ease-in-out infinite}
@keyframes sweep{from{transform:translateX(-35%)}to{transform:translateX(35%)}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-10px);z-index:20;opacity:0;width:max-content;max-width:calc(100% - 2*var(--gutter));
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;transition:.35s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nogl{display:none}
html.no-gl .nogl{display:grid;position:fixed;inset:0;z-index:5;place-content:center;gap:10px;padding:0 var(--gutter);text-align:center;background:var(--paper)}
@media (max-width:600px){.log{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 84px)}.clock b{font-size:20px}}
@media (prefers-reduced-motion:reduce){#loader b::after,.stampBtn.on{animation:none}}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="tilt t" aria-hidden="true"></div><div class="tilt b" aria-hidden="true"></div>
<div class="brand">HAKOBUNE<small>ハコブネ物流｜EC発送代行</small></div>
<div class="clock" aria-live="polite"><small id="clockStep">出荷前</small><b id="clockTime">--:--</b></div>

<div class="tag" data-k="0"><b>集荷</b><span>08:30</span></div>
<div class="tag" data-k="1"><b>仕分け倉庫</b><span>10:10</span></div>
<div class="tag" data-k="2"><b>幹線輸送</b><span>12:00</span></div>
<div class="tag" data-k="3"><b>納品・受領</b><span>15:40</span></div>
<div class="log" id="log" aria-live="polite"></div>

<div class="ship" id="ship">
  <label for="company">社名を入れて、出荷してください</label>
  <form id="shipForm" autocomplete="off"><input id="company" type="text" maxlength="18" placeholder="例：株式会社みなと"><button class="btn" type="submit">出荷</button></form>
</div>
<button class="stampBtn" id="stampBtn" type="button">受領印を<br>押す</button>
<div class="finale" id="finale">
  <p>御社の荷物も、この流れで</p>
  <div class="row"><button class="btn" type="button" id="toEst">見積を依頼する</button><button class="btn ghost" type="button" id="again">もう一度出荷する</button></div>
  <small>このページは、GROWXの体験型サイトのデモです。社名・時刻・サービス内容はすべて架空のもので、入力内容はどこにも送信・保存されません。</small>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="estTitle">
  <form class="sheet" id="estForm">
    <h2 id="estTitle">見積を依頼する</h2>
    <label>会社名<input id="estCompany" type="text" maxlength="40"></label>
    <label>月の出荷件数<select><option>〜500件</option><option>500〜2,000件</option><option>2,000件以上</option></select></label>
    <label>主な商品<select><option>化粧品・サプリ</option><option>アパレル</option><option>食品（常温）</option><option>雑貨・その他</option></select></label>
    <div class="acts"><button class="btn" type="submit">送信する</button><button class="btn ghost" type="button" id="closeEst">閉じる</button></div>
    <p>※ デモのため、送信は行われません。</p>
  </form>
</div>
<div class="nogl"><b style="font-family:var(--display);font-size:24px">ハコブネ物流</b><p>集荷 08:30 → 仕分け倉庫 10:10 → 幹線輸送 12:00 → 納品・受領 15:40</p><p>御社の荷物も、この流れで</p></div>
<div id="loader" aria-hidden="true"><b>HAKOBUNE</b></div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,seg=(p,a,b)=>clamp((p-a)/(b-a));
const io3=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,o3=t=>1-Math.pow(1-t,3);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches,MOB=Math.min(innerWidth,innerHeight)<700;
function rnd(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rnd(7);
const toastEl=$('#toast');let tt;function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),2400)}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

if(document.readyState!=='complete')await new Promise(r=>addEventListener('load',r,{once:true}));
await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(r,120))));
const yieldNow=()=>new Promise(r=>setTimeout(r,0));
let THREE;try{THREE=await import('./assets/three.module.min.js')}catch(e){}
let renderer=null;
if(THREE){try{renderer=new THREE.WebGLRenderer({canvas:$('#gl'),antialias:!(MOB&&devicePixelRatio>=2),powerPreference:'high-performance'})}catch(e){renderer=null}}
if(!renderer){document.documentElement.classList.add('no-gl');$('#loader').classList.add('done')}else await start();

async function start(){
let LOW=false;try{const gl=renderer.getContext(),ext=gl.getExtension('WEBGL_debug_renderer_info');LOW=/swiftshader|llvmpipe|software/i.test(ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):'')}catch(e){}
if(LOW)document.documentElement.classList.add('low');
renderer.setPixelRatio(LOW?.75:Math.min(devicePixelRatio||1,MOB?1.5:1.75));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=!LOW;renderer.shadowMap.type=THREE.PCFSoftShadowMap;

/* ---------- 色（生成り＋藍） ---------- */
const C={paper:'#EFE8DA',ground:'#E6DECD',side:'#CFC6B3',road:'#BDB6AA',line:'#F4EFE4',bld:['#F5F0E6','#E8E1D3','#DCD5C7','#EDE6D8'],roof:['#C9C1B2','#B8B0A2'],sage:'#A7B39A',sageD:'#8E9B82',kraft:'#C29A6B',ink:'#1E2433',accent:'#2E4A86',white:'#F7F4EE',tire:'#2B2E35'};
const scene=new THREE.Scene();scene.background=new THREE.Color(C.paper);scene.fog=new THREE.Fog(C.paper,40,120);
const cam=new THREE.PerspectiveCamera(30,1,.1,120);
const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.82,metalness:0,...o});   /* つや消しの模型素材 */
const mesh=(g,m,sh=true)=>{const x=new THREE.Mesh(g,m);x.castShadow=sh;x.receiveShadow=true;return x};
function cvTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t}
/* 角の丸い箱（模型らしさ） */
function rbox(w,h,d,r=.08){const s=new THREE.Shape(),x=-w/2,y=-h/2;s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);
  const g=new THREE.ExtrudeGeometry(s,{depth:d-2*r,bevelEnabled:true,bevelThickness:r,bevelSize:r*.9,bevelSegments:3,curveSegments:6});g.translate(0,0,-(d-2*r)/2);g.computeVertexNormals();return g}

/* ---------- 光：時刻に合わせて朝→昼→午後 ---------- */
const hemi=new THREE.HemisphereLight('#FFF6E8','#BFB4A0',1.1);scene.add(hemi);
const sun=new THREE.DirectionalLight('#FFE2B8',2.4);sun.castShadow=!LOW;
sun.shadow.mapSize.set(MOB?1024:2048,MOB?1024:2048);sun.shadow.camera.left=-22;sun.shadow.camera.right=22;sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;sun.shadow.camera.far=90;sun.shadow.bias=-.0006;sun.shadow.radius=4;
scene.add(sun,sun.target);
const SKY=[['#E6E1D8','#FFE2B8',[-14,12,10]],['#DCE5EE','#FFFFFF',[3,20,8]],['#EAD9C7','#FFD1A0',[16,11,9]]];   /* 実写の空：朝はうっすら暖色、昼は淡い青、午後は夕方寄り */   /* 朝・昼・午後：背景・日差しの色・太陽の位置 */
const tc1=new THREE.Color(),tc2=new THREE.Color();
function setTime(f){f=clamp(f,0,2);const i=Math.min(1,Math.floor(f)),k=f-i,A=SKY[i],B=SKY[i+1];
  tc1.set(A[0]).lerp(tc2.set(B[0]),k);scene.background.copy(tc1);scene.fog.color.copy(tc1);
  sun.color.set(A[1]).lerp(tc2.set(B[1]),k);sun.userData.off=A[2].map((v,j)=>lerp(v,B[2][j],k))}
setTime(0);

/* ---------- 街（ジオラマ） ---------- */
/* 最初はコードで描いた簡易の街を出し、Blenderで作った街（assets/town.glb）が届いたら差し替える */
const oldTown=new THREE.Group();scene.add(oldTown);
const base=mesh(new THREE.BoxGeometry(64,.6,16),[M(C.side),M(C.side),M(C.ground),M(C.side),M(C.side),M(C.side)],false);base.position.set(3,-.3,0);oldTown.add(base);
const roadM=M(C.road,{roughness:.9});const road=mesh(new THREE.BoxGeometry(62,.04,2.6),roadM,false);road.position.set(3,.02,.4);oldTown.add(road);
for(let x=-27;x<33;x+=1.6){const d=mesh(new THREE.BoxGeometry(.7,.02,.08),M(C.line),false);d.position.set(x,.05,.4);oldTown.add(d)}
const wallMats=[];   /* 建物の壁（あとで石こうの凹凸を貼る） */
function bld(x,z,w,h,d,ci,win=true){const g=new THREE.Group();const wm0=M(C.bld[ci%4]);wallMats.push(wm0);const b=mesh(rbox(w,h,d,.1),wm0);b.position.y=h/2;g.add(b);
  const r=mesh(rbox(w+.2,.16,d+.2,.06),M(C.roof[ci%2]));r.position.y=h+.08;g.add(r);
  if(win){const wm=M('#7C8496',{roughness:.4});for(let i=0;i<Math.floor(w/.9);i++)for(let j=0;j<Math.max(1,Math.floor(h/1.1));j++){const q=mesh(new THREE.BoxGeometry(.42,.5,.04),wm,false);q.position.set(-w/2+.55+i*.9,.7+j*1.05,d/2+.02);if(q.position.x<w/2-.3&&q.position.y<h-.3)g.add(q)}}
  g.position.set(x,0,z);oldTown.add(g);return g}
function tree(x,z,s=1){const g=new THREE.Group();const t=mesh(new THREE.CylinderGeometry(.06*s,.08*s,.5*s,8),M('#8A7A64'));t.position.y=.25*s;g.add(t);
  const c=mesh(new THREE.SphereGeometry(.42*s,14,12),M(R()<.5?C.sage:C.sageD));c.position.y=.75*s;c.scale.y=1.15;g.add(c);g.position.set(x,0,z);oldTown.add(g)}
/* 出荷元（御社）・倉庫・届け先 */
bld(-19,-3.4,4.2,2.2,3,0);const desk=mesh(rbox(1.6,.5,1,.05),M('#D9CDB6'));desk.position.set(-19,.25,-1.2);oldTown.add(desk);
const wh=bld(0,-4.2,10,3.2,4.4,2);
bld(23,-3.4,3.6,2.4,3,3);const door=mesh(new THREE.BoxGeometry(.8,1.3,.06),M('#9A8A72'));door.position.set(23,.65,-1.88);oldTown.add(door);
[[-25,-4,3,1.6,2.6,1],[-13,-4.6,2.8,2.8,2.2,3],[-8,-4.4,3.2,1.8,2.4,1],[9,-4.6,3,2.2,2.4,0],[14,-4.2,3.4,1.6,2.6,3],[29,-4.2,3,2,2.6,2]].forEach(a=>bld(...a));
[[-23,-1.6,.9],[-15,-1.8,1],[-10,-1.7,.8],[6,-1.9,1],[17,-1.8,.9],[27,-1.6,1],[-21,3,1.1],[-12,3.2,.9],[-4,3.4,1],[8,3.1,1.1],[18,3.3,.9],[26,3,1]].forEach(a=>tree(...a));
/* 倉庫前のベルトコンベアとスキャンの門 */
const belt=mesh(rbox(7,.16,1,.05),M('#4A4F5C',{roughness:.6}));belt.position.set(0,.62,-1.3);oldTown.add(belt);
for(const x of [-3.2,-1,1.2,3.2]){const l=mesh(new THREE.BoxGeometry(.08,.6,.8),M('#6E7380'));l.position.set(x,.3,-1.3);oldTown.add(l)}
const arch=new THREE.Group();const am=M(C.accent,{roughness:.5});
[[-.62,0],[.62,0]].forEach(([z])=>{const p=mesh(new THREE.BoxGeometry(.1,1.4,.1),am);p.position.set(0,1.1,-1.3+z);arch.add(p)});const top=mesh(new THREE.BoxGeometry(.12,.1,1.36),am);top.position.set(0,1.8,-1.3);arch.add(top);oldTown.add(arch);
const scanM=new THREE.MeshBasicMaterial({color:'#7FA6FF',transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending,toneMapped:false});
const scan=new THREE.Mesh(new THREE.PlaneGeometry(1.2,1),scanM);scan.rotation.y=Math.PI/2;scan.position.set(0,1.1,-1.3);scene.add(scan);
/* 段ボールの質感（濵田さんのGeminiの画像：側面・テープを貼った上面）。主役の箱・ベルトの荷物・荷台の荷物で共通 */
const TL=new THREE.TextureLoader(),kTex=u=>{const t=TL.load(u);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t};
const KS=M('#fff',{map:kTex('assets/box-side.jpg'),roughness:.9}),KT=M('#fff',{map:kTex('assets/box-top.jpg'),roughness:.88}),KM=[KS,KS,KT,KS,KS,KS];   /* 箱の面の順：右・左・上・下・前・後 */
/* ほかの荷物（倉庫の中の流れ） */
const OB=8,others=new THREE.InstancedMesh(new THREE.BoxGeometry(.5,.36,.5),KM,OB);others.castShadow=!LOW;others.receiveShadow=true;scene.add(others);const OD=new THREE.Object3D();

/* ---------- 車（模型らしい丸み。会社のロゴは架空） ---------- */
const logoTex=cvTex(512,128,(x,w,h)=>{x.fillStyle=C.white;x.fillRect(0,0,w,h);x.fillStyle=C.accent;x.fillRect(0,h-14,w,14);x.fillStyle=C.ink;x.font='700 54px "HK Mincho","Hiragino Mincho ProN",serif';if('letterSpacing' in x)x.letterSpacing='10px';x.textAlign='center';x.fillText('HAKOBUNE',w/2,h*.62)});
function vehicle(len,cab,load=0){const g=new THREE.Group();g.userData.kind=len<2?'van_body':'truck_body';   /* 荷台がむき出しの車：主役の箱が運ばれる姿を見せる */
  const deck=mesh(rbox(len,.22,1.25,.06),M(C.white));deck.position.set(-.2,.66,0);g.add(deck);const old=[deck];g.userData.old=old;   /* old＝Blenderの車体が届いたら隠す部品 */
  [[.6],[-.6]].forEach(([z])=>{const r=mesh(new THREE.BoxGeometry(len,.16,.06),M(C.white));r.position.set(-.2,.85,z);g.add(r);old.push(r)});
  const bk=mesh(new THREE.BoxGeometry(.06,.6,1.25),M(C.white));bk.position.set(len/2-.24,1.07,0);g.add(bk);old.push(bk);
  const cb=mesh(rbox(cab,1.05,1.2,.16),M(C.accent,{roughness:.55}));cb.position.set(len/2+cab/2-.15,1.05,0);g.add(cb);old.push(cb);
  const gl=mesh(new THREE.BoxGeometry(.05,.36,1.0),M('#2D3442',{roughness:.2}));gl.position.set(len/2+cab-.17,1.25,0);g.add(gl);old.push(gl);
  const lg=new THREE.Mesh(new THREE.PlaneGeometry(len*.62,len*.155),new THREE.MeshStandardMaterial({map:logoTex,roughness:.7}));lg.position.set(-.2,.66,.632);g.add(lg);g.userData.logo=lg;
  for(let i=0;i<load;i++){const o=mesh(new THREE.BoxGeometry(.55,.4,.55),KM);o.position.set(len/2-.65-(i%3)*.6,.97+Math.floor(i/3)*.41,(i%2?.25:-.25));o.rotation.y=i*.3;g.add(o)}   /* ほかの荷物も一緒に運ぶ */
  const wg=new THREE.CylinderGeometry(.24,.24,.18,20);wg.rotateX(Math.PI/2);const wm=M(C.tire,{roughness:.7});g.userData.wheels=[];
  [[-len/2+.35,.62],[len/2+cab/2-.2,.62],[-len/2+.35,-.62],[len/2+cab/2-.2,-.62]].forEach(([x,z])=>{const w=mesh(wg,wm);w.position.set(x,.24,z);g.add(w);g.userData.wheels.push(w)});
  scene.add(g);return g}
const van=vehicle(1.7,.75,0),truck=vehicle(3.6,.95,4);
/* Blenderで作った実写寄りのトラック（truck.glb：濵田さんのGeminiの三面図とあおり板の画像から作成）が届いたら、コードで描いた車と差し替える。
   幹線トラックは実寸、集荷の車は同じ形を0.72倍。荷台のロゴ・積み荷・動きはそのまま、タイヤは車体の子（wheel_*）を回す */
let VAN_Y=1.1;   /* 集荷の車に載せた箱の中心の高さ */
function useVehicles(GLTFLoader){const L=new THREE.TextureLoader();
  L.load('assets/truck-ao.jpg',ao=>{ao.flipY=false;ao.channel=1;
    new GLTFLoader().load('assets/truck.glb',v=>{const src=v.scene.getObjectByName('truck_real');if(!src)return;const mats=new Map();
      src.traverse(c=>{if(!c.isMesh)return;const m=c.material;if(!mats.has(m)){const n=LOW?new THREE.MeshLambertMaterial({color:m.color,map:m.map}):m;n.aoMap=ao;n.aoMapIntensity=.6;n.needsUpdate=true;mats.set(m,n)}c.material=mats.get(m);c.castShadow=!LOW;c.receiveShadow=true});
      [[van,.72],[truck,1]].forEach(([g,k])=>{const body=src.clone();body.scale.setScalar(k);g.add(body);
        g.userData.old.forEach(o=>o.visible=false);g.userData.wheels.forEach(w=>w.visible=false);
        g.userData.spin=[];body.traverse(c=>{if(/^wheel/.test(c.name))g.userData.spin.push(c)});g.userData.r=.36*k;
        const lg=g.userData.logo;if(lg){const h=lg.geometry.parameters.height;lg.scale.setScalar(.34*k/h);lg.position.set(-.2*k,1.03*k,.972*k)}});   /* ロゴはあおり板の外側へ */
      VAN_Y=.8*.72+.33})})}

/* ---------- 主役：社名入りの段ボール ---------- */
let company='御社';
/* 送り状（Geminiの罫線だけの複写紙）に、入力した社名をその場で印字する。会社名・番号・ロゴは架空も含めて入れない */
const wbImg=new Image();wbImg.src='assets/waybill.jpg';
function boxFace(){return cvTex(1024,776,(x,w,h)=>{
  x.fillStyle='#F4F4F2';x.fillRect(0,0,w,h);if(wbImg.complete&&wbImg.naturalWidth)x.drawImage(wbImg,0,0,w,h);
  const S='"Hiragino Sans","Noto Sans JP",sans-serif';x.fillStyle='#1E2433';
  x.font=`600 30px ${S}`;x.fillText('お届け先',70,130);
  let fs=150;const name=company+' 様';x.font=`700 ${fs}px ${S}`;while(x.measureText(name).width>w*.88&&fs>40){fs-=2;x.font=`700 ${fs}px ${S}`}
  x.shadowColor='rgba(30,36,51,.35)';x.shadowBlur=2;x.fillText(name,60,470);x.shadowBlur=0;   /* 黒インクのわずかなにじみ */
  x.font=`500 30px ${S}`;x.fillStyle='rgba(30,36,51,.75)';x.fillText('ハコブネ物流',560,130);x.fillText('品名：商品一式',60,620)})}
const box=new THREE.Group();const boxM=mesh(new THREE.BoxGeometry(.9,.66,.9),KM);box.add(boxM);scene.add(box);
/* ExtrudeGeometry の面の割り当て：0=前後の面 1=側面。前面にだけ伝票を出すため、伝票は別の板として貼る */
const boxSideMats=[KS,KT];
const label=new THREE.Mesh(new THREE.PlaneGeometry(.7,.53),M('#fff',{map:boxFace(),roughness:.85}));label.position.set(.06,-.04,.452);label.rotation.z=-.015;box.add(label);
function redrawLabel(){const t=boxFace();label.material.map.dispose();label.material.map=t;label.material.needsUpdate=true}
function printName(v){company=v.trim()||'御社';redrawLabel();bounce=1}
wbImg.onload=redrawLabel;
/* 受領印（届け先で押す）と、押した跡 */
const inkTex=cvTex(256,256,(x,w,h)=>{x.strokeStyle='#B3322B';x.lineWidth=12;x.beginPath();x.arc(128,128,108,0,7);x.stroke();x.fillStyle='#B3322B';x.font='700 70px "HK Mincho","Hiragino Mincho ProN",serif';x.textAlign='center';x.fillText('受領',128,140);x.font='600 30px sans-serif';x.fillText('15:40',128,190)});
const ink=new THREE.Mesh(new THREE.PlaneGeometry(.5,.5),new THREE.MeshStandardMaterial({map:inkTex,transparent:true,opacity:0,roughness:.9,depthWrite:false}));ink.rotation.x=-Math.PI/2;ink.position.y=.335;box.add(ink);
const stamp=new THREE.Group();const sh=mesh(new THREE.CylinderGeometry(.12,.16,.5,20),M('#3A2E26',{roughness:.5}));sh.position.y=.45;stamp.add(sh);const sb=mesh(new THREE.CylinderGeometry(.27,.27,.12,28),M('#2B2E35'));sb.position.y=.12;stamp.add(sb);stamp.visible=false;scene.add(stamp);

/* 本物の質感（CC0・ambientCG）：段ボールの波目・アスファルトのざらつき・石こうの壁。最初の画面のあとに読む */
if(!LOW){const L=new THREE.TextureLoader(),ld=u=>new Promise(r=>L.load(u,r,undefined,()=>r(null)));
  Promise.all(['assets/cardboard-normal.jpg','assets/asphalt-normal.jpg','assets/asphalt-rough.jpg','assets/plaster-normal.jpg'].map(ld)).then(([cb,an,ar,pl])=>{
    const rep=(t,x,y)=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(x,y);return t};
    if(cb){rep(cb,1.4,1.4);boxSideMats.forEach(m=>{m.normalMap=cb;m.normalScale.set(.3,.3);m.needsUpdate=true})}
    if(an&&ar){rep(an,40,2);rep(ar,40,2);roadM.normalMap=an;roadM.normalScale.set(.5,.5);roadM.roughnessMap=ar;roadM.needsUpdate=true}
    if(pl){rep(pl,.45,.45);wallMats.forEach(m=>{m.normalMap=pl;m.normalScale.set(.7,.7);m.needsUpdate=true})}
  })}
/* Blenderで作った実寸の街（town.glb：濵田さんのGeminiの見本・図面・質感画像から。外壁は図面の写真、道路・歩道・駐車場・縁石もGeminiの質感）。最初の画面のあとに読む */
Promise.all([import('./assets/gltf-loader.min.js')]).then(([{GLTFLoader}])=>{
  useVehicles(GLTFLoader);
  new GLTFLoader().load('assets/town.glb',g=>{
    const L=new THREE.TextureLoader(),tile=(u,rx)=>{const t=L.load(u);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,rx);return t};
    const pl=LOW?null:tile('assets/plaster-normal.jpg',.45),an=LOW?null:tile('assets/asphalt-normal.jpg',.65);
    const done=new Map();
    g.scene.traverse(o=>{if(!o.isMesh)return;o.castShadow=!LOW;o.receiveShadow=true;
      const m=o.material;if(done.has(m)){o.material=done.get(m);return}
      let n=m;if(LOW)n=new THREE.MeshLambertMaterial({color:m.color});
      if(!LOW){if(/^wall/.test(m.name)){n.normalMap=pl;n.normalScale.set(.6,.6)}
        if(m.map){m.map.anisotropy=8}
        if(m.name==='road'){n.normalMap=an;n.normalScale.set(.4,.4)}}
      n.needsUpdate=true;done.set(m,n);o.material=n});
    scene.remove(oldTown);scene.add(g.scene)})});
await yieldNow();
if(LOW){scene.traverse(o=>{if(o.material&&!Array.isArray(o.material)&&o.material.isMeshStandardMaterial){const m=o.material;o.material=new THREE.MeshLambertMaterial({color:m.color,map:m.map,transparent:m.transparent,opacity:m.opacity})}})}

/* ---------- 体験の進行（出荷を押してから約9秒） ---------- */
const STEPS=[{t:'08:30',n:'集荷',m:'集荷しました'},{t:'10:10',n:'仕分け倉庫',m:'スキャン・仕分け完了'},{t:'12:00',n:'幹線輸送',m:'幹線トラックで輸送中'},{t:'15:40',n:'納品・受領',m:'お届け先に到着'}];
const ST=[-19,0,8,22];                    /* 各地点のx位置 */
let phase='idle',t0=0,bounce=0,stamped=false,stampT=0,logged=-1;
const DESK={x:-19,y:.5+.33,z:-1.2};
function resetAll(){phase='idle';stamped=false;logged=-1;$('#log').innerHTML='';$$('.tag').forEach(e=>e.classList.remove('on'));$('#clockStep').textContent='出荷前';$('#clockTime').textContent='--:--';
  ink.material.opacity=0;stamp.visible=false;$('#log').style.opacity=1;$('#ship').classList.remove('out');$('#finale').classList.remove('show');$('#stampBtn').classList.remove('on');setTime(0)}
function logStep(i){if(i<=logged)return;logged=i;const s=STEPS[i],p=document.createElement('p');const b=document.createElement('b');b.textContent=s.t;p.append(b,' '+s.n+'　'+s.m);$('#log').appendChild(p);requestAnimationFrame(()=>p.classList.add('on'));
  $$('.tag')[i].classList.add('on');$('#clockStep').textContent=s.n;$('#clockTime').textContent=s.t}
$('#company').addEventListener('input',e=>printName(e.target.value));
$('#shipForm').addEventListener('submit',e=>{e.preventDefault();if(phase!=='idle')return;printName($('#company').value);$('#company').blur();$('#ship').classList.add('out');phase='run';t0=performance.now()});
$('#stampBtn').addEventListener('click',()=>{if(phase!=='wait')return;phase='stamp';stampT=performance.now();$('#stampBtn').classList.remove('on')});
$('#toEst').addEventListener('click',()=>{$('#estCompany').value=company==='御社'?'':company;$('#modal').classList.add('show')});
$('#closeEst').addEventListener('click',()=>$('#modal').classList.remove('show'));
$('#estForm').addEventListener('submit',e=>{e.preventDefault();$('#modal').classList.remove('show');toast('デモのため、送信は行われません。')});
$('#again').addEventListener('click',resetAll);

/* 箱の位置を時間から決める（物が工程を実演する） */
const V=new THREE.Vector3();
function placeAll(t,now){
  /* 0〜1.4秒：集荷トラックが来て箱を積む／1.4〜3.2秒：倉庫へ／3.2〜4.8秒：ベルトとスキャン／4.8〜5.6秒：幹線トラックへ／5.6〜8.2秒：届け先へ／8.2〜9秒：降ろす */
  const a=(s,e)=>clamp((t-s)/(e-s));
  let vx=-27,tx=4,bx=DESK.x,by=DESK.y,bz=DESK.z,brz=0;
  if(phase==='idle'){vx=-27;tx=4}
  else{
    vx=lerp(-27,-19.2,o3(a(0,1.1)));                                   /* 集荷トラックが来る */
    const lift=a(1.1,1.5);if(t<1.5){bx=lerp(DESK.x,-19.7,lift);by=lerp(DESK.y,VAN_Y,lift)+Math.sin(lift*Math.PI)*.8;bz=lerp(DESK.z,.4,lift)}
    if(t>=1.5&&t<3.2){vx=lerp(-19.2,-4.6,io3(a(1.5,3.2)));bx=vx-.5;by=VAN_Y;bz=.4}
    if(t>=3.2){vx=lerp(-4.6,-2,o3(a(3.2,3.8)))-(t>4?(t-4)*6:0)}
    if(t>=3.2&&t<4.8){const k=a(3.2,3.6);bx=lerp(-5.1,-3.2,k);by=lerp(VAN_Y,.9,k)+Math.sin(k*Math.PI)*.4;bz=lerp(.4,-1.3,k);if(t>3.6){bx=lerp(-3.2,3.2,io3(a(3.6,4.8)));by=.9;bz=-1.3}}
    tx=lerp(4,6.2,o3(a(3.4,4.6)));
    if(t>=4.8&&t<5.6){const k=a(4.8,5.6);bx=lerp(3.2,tx-1.5,k);by=lerp(.9,1.1,k)+Math.sin(k*Math.PI)*.6;bz=lerp(-1.3,.4,k)}
    if(t>=5.6){tx=lerp(6.2,21.6,io3(a(5.6,8.2)));bx=tx-1.5;by=1.1;bz=.4}
    if(t>=9.0)tx=lerp(21.6,38,io3(a(9.0,10.6)));   /* 降ろしたらトラックは去り、届いた箱だけが残る */
    if(t>=8.2){const k=a(8.2,9);bx=lerp(tx-1.5,23,k);by=lerp(1.1,.33,o3(k))+Math.sin(k*Math.PI)*.5;bz=lerp(.4,-1.2,k)}
    if(t>4.2)logStep(1);if(t>5.6)logStep(2);if(t>=1.2)logStep(0);if(t>=8.9)logStep(3);
    /* 光：集荷08:30（朝）→12:00（昼）→15:40（午後） */
    setTime(t<5.6?lerp(0,1,a(1,5.6)):lerp(1,2,a(5.6,8.6)));
  }
  van.position.set(vx,0,.4);truck.position.set(tx,0,.4);
  const sp=(g,v)=>{g.userData.wheels.forEach(w=>w.rotation.z=-v/.24);(g.userData.spin||[]).forEach(w=>w.rotation.z=-v/g.userData.r)};sp(van,vx);sp(truck,tx);
  /* 止まるたびに小さく弾む（余韻） */
  box.position.set(bx,by+(RM?0:Math.max(0,bounce)*.12*Math.sin(bounce*Math.PI*3)),bz);bounce=Math.max(0,bounce-.03);
  /* スキャン：箱が門をくぐる瞬間だけ光る */
  scanM.opacity=phase==='run'&&Math.abs(bx)<.7&&bz<-1?.55*(1-Math.abs(bx)/.7):0;
  /* ほかの荷物がベルトを流れる（群れ） */
  for(let i=0;i<OB;i++){const u=((now/1000)*.5+i/OB)%1;OD.position.set(lerp(-3.3,3.3,u),.98,-1.3);OD.rotation.y=i*.7;OD.scale.setScalar(u<.05||u>.95?0:1);OD.updateMatrix();others.setMatrixAt(i,OD.matrix)}others.instanceMatrix.needsUpdate=true;
  return {bx,by,bz};
}

/* ---------- 画面サイズ・カメラ ---------- */
function resize(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.fov=innerWidth<innerHeight?40:30;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const camT=new THREE.Vector3(DESK.x,.6,DESK.z),camP=new THREE.Vector3();
const tags=$$('.tag');
function toScreen(v){v.project(cam);return[(v.x+1)/2*innerWidth,(1-v.y)/2*innerHeight]}

try{if(renderer.compileAsync)await renderer.compileAsync(scene,cam)}catch(e){}
let last=performance.now(),first=true,runK=0;
function frame(now){
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
  const t=phase==='idle'?0:(now-t0)/1000;
  if(phase==='run'&&t>=9.6){phase='wait'}
  const b=placeAll(phase==='idle'?0:Math.min(t,10.6),now);
  /* 受領印を押す：上から落ちて、ドンと押され、朱肉がにじむ */
  if(phase==='stamp'||stamped){const k=clamp((now-stampT)/700);stamp.visible=k<1;
    stamp.position.set(b.bx,b.by+.33+lerp(1.6,0,o3(Math.min(1,k*1.6)))+(k>.62?(k-.62)*3:0),b.bz);stamp.scale.set(1,k>.55&&k<.7?.8:1,1);
    if(k>.6&&!stamped){stamped=true;bounce=1;if(!RM)try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}}
    ink.material.opacity=stamped?clamp((now-stampT-420)/400)*.92:0;
    if(k>=1&&phase==='stamp'){phase='done';$('#finale').classList.add('show');$('#log').style.opacity=0}}
  /* カメラ：少し上から見下ろし、箱について横へ */
  const pt=innerWidth<innerHeight;runK+=((phase==='idle'?0:1)-runK)*(1-Math.exp(-dt*(RM?20:1.6)));   /* 入力中は箱に寄り、走り出したら街を見渡す */
  const near=pt?[.5,3.4,7.6]:[1.3,2.5,5.4],far=pt?[2,19,30]:[4,14,24],off=near.map((v,j)=>lerp(v,far[j],runK));
  camT.lerp(V.set(b.bx+(pt?0:lerp(.6,1.6,runK)),lerp(.7,.6,runK),b.bz*lerp(.8,.3,runK)),1-Math.exp(-dt*(RM?20:pt?11:4)));   /* 縦長の画面は見える幅が狭いので、箱をしっかり追う */
  camP.set(camT.x+off[0],off[1],camT.z+off[2]);cam.position.copy(camP);cam.lookAt(camT);
  const so=sun.userData.off||[0,12,6];sun.position.set(camT.x+so[0],so[1],camT.z+so[2]);sun.target.position.copy(camT);
  renderer.render(scene,cam);
  /* 地点の札：3Dの地点の上に */
  tags.forEach((el,i)=>{V.set(ST[i]+(i===0?-.4:i===2?-1:0),i===1?3.0:2.7,i===1?-2:-.6);const[x,y]=toScreen(V),w=el.offsetWidth/2;el.style.left=x+'px';el.style.top=y+'px';el.style.visibility=(x-w<4||x+w>innerWidth-4||y<96||V.z>1)?'hidden':'visible'});   /* 画面の外に出た地点の札は隠す */
  /* 受領印のボタン：箱の上に */
  if(phase==='wait'){V.set(b.bx,b.by+1.2,b.bz);const[x,y]=toScreen(V);const sb=$('#stampBtn');sb.style.left=x+'px';sb.style.top=Math.max(130,y)+'px';sb.classList.add('on')}
  if(first){first=false;requestAnimationFrame(()=>$('#loader').classList.add('done'))}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}
</script>
<script src="assets/jp-wrap.js" data-selector=".finale small" defer></script>
