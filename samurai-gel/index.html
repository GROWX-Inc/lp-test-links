body{margin:0;background:#0E0E0E}
a{color:#C41E3A}a:hover{color:#8E1328}
.sg *,.sg *::before,.sg *::after{box-sizing:border-box}
.sg{font-family:'Noto Sans JP',sans-serif;font-size:16px;line-height:1.8;color:#141414;background:#F5F3EE;overflow-x:clip;word-break:auto-phrase}
.sg p{margin:0}
.sg h1,.sg h2,.sg h3,.sg h4{margin:0}
.sg img{display:block;max-width:100%}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 clamp(15px,4.5vw,40px)}
.sec{padding:clamp(72px,9vw,128px) 0}
.min{font-family:'Shippori Mincho B1',serif}
.en{font-family:'Barlow Condensed',sans-serif;letter-spacing:.12em;text-transform:uppercase}
.h2{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:clamp(28px,3.6vw,46px);line-height:1.45}
.eyebrow{font-family:'Barlow Condensed',sans-serif;letter-spacing:.24em;font-size:16px;font-weight:600;text-transform:uppercase;display:flex;align-items:center;gap:12px}
.eyebrow::before{content:'';width:28px;height:2px;background:currentColor}
.lead{font-size:17px;line-height:2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border-radius:999px;font-size:16px;font-weight:700;text-decoration:none;border:1px solid transparent;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:background .2s}
.btn-red{background:#C41E3A;color:#FFFFFF}.btn-red:hover{background:#A5172F;color:#FFFFFF}
.btn-line-d{border-color:rgba(245,243,238,.8);color:#F5F3EE;background:rgba(0,0,0,.2)}.btn-line-d:hover{background:#F5F3EE;color:#141414}
.btn-ink{background:#141414;color:#F5F3EE}.btn-ink:hover{background:#000;color:#F5F3EE}
.need{display:inline-flex;align-items:center;gap:6px;background:#FFE14D;color:#141414;font-size:14px;font-weight:700;line-height:1.5;padding:3px 10px;border-radius:4px;font-family:'Noto Sans JP',sans-serif;letter-spacing:0;text-transform:none;word-break:normal}
.need b{font-family:'Barlow Condensed',sans-serif;font-size:15px;letter-spacing:.05em}
.chk{display:inline-flex;align-items:center;gap:6px;border:2px dashed #E0B800;color:inherit;font-size:14px;font-weight:700;line-height:1.5;padding:2px 10px;border-radius:4px;letter-spacing:0;text-transform:none}
.photo{position:relative;overflow:hidden;border-radius:6px;background:#222}
.photo img{width:100%;height:100%;object-fit:cover}
.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hdr{position:sticky;top:0;z-index:20;background:rgba(14,14,14,.88);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.08)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:72px}
.nav{display:flex;align-items:center;gap:clamp(12px,1.8vw,26px)}
.nav a{color:#F5F3EE;text-decoration:none;font-size:15px;font-weight:500;padding:12px 0}
.nav a:hover{color:#FF6B6B}
.hdr-sp{display:none;align-items:center;gap:10px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:999px;border:1px solid #5C5850;background:transparent;color:#F5F3EE;cursor:pointer}
.hero{position:relative;color:#F5F3EE;overflow:hidden;background:#0E0E0E}
.hero-bg{position:absolute;inset:0}

<!-- ===== 01 オープニング ===== -->
<section id="top" class="hero">
<div class="hero-bg"><img src="media/photo_trail_birch.jpg" alt=""></div>
<div class="hero-shade"></div>
<div class="wrap hero-in">
<div style="display: flex; flex-direction: column; gap: 28px">
<p class="eyebrow" style="color: #FF6B6B">Japanese Energy Gel</p>
<h1 class="min" style="font-weight: 800; font-size: clamp(40px,5.6vw,78px); line-height: 1.3; letter-spacing: .02em">前へ進む刀。<br>身体を守る鎧。</h1>
<p style="font-size: clamp(17px,1.5vw,20px); line-height: 1.9; color: #DAD6CE">疲れた後半でも、飲みやすい。<br>走って、試して、つくった日本のエナジージェル。</p>
<div style="display: flex; flex-wrap: wrap; gap: 14px">
<a class="btn btn-red" href="#sim">あなたの補給プランを見る</a>
<a class="btn btn-line-d" href="#sets">オンラインストアで購入する</a>
</div>
</div>

<img class="pk-k" src="media/pouch_katana.png" alt="SAMURAI GEL 刀（ENERGY）">
<img class="pk-y" src="media/pouch_yoroi.png" alt="SAMURAI GEL 鎧（RECOVERY）">
</div>
</div>
<div class="wrap" style="position: relative">
<div class="facts">
<div><p class="en" style="font-size: 15px; color: #C9C5BC">Prototypes</p><p style="font-size: 18px; font-weight: 700">走りながら、80回の試作</p></div>
<div><p class="en" style="font-size: 15px; color: #C9C5BC">Quality</p><p style="font-size: 18px; font-weight: 700">FSSC 22000認証の工場で製造</p></div>
<div><p class="en" style="font-size: 15px; color: #C9C5BC">Made in Japan</p><p style="font-size: 18px; font-weight: 700">国内製造のエナジージェル</p></div>
</div>
</div>
<p class="wrap" style="position: relative; font-size: 14px; color: #C9C5BC; padding-top: 8px; padding-bottom: 20px">※背景は本番でレース映像（弊社制作）に差し替え</p>
</section>

<!-- ===== 02 飲めること ===== -->
<section id="why" class="sec" style="background: #F5F3EE">
<div class="wrap" style="display: flex; flex-direction: column; gap: clamp(40px,5vw,64px)">
<div class="split">
<div style="display: flex; flex-direction: column; gap: 28px">
<p class="eyebrow" style="color: #C41E3A">Why</p>
<h2 class="h2">疲れた身体に、<br>飲めなければ意味がない。</h2>
<div class="lead" style="display: flex; flex-direction: column; gap: 20px; color: #2E2C28">
<p>エナジージェルは、何十キロも走り、呼吸が上がった状態で口にするものです。<br>それなのに、粘りが強く口に残るものや、水がないと飲みにくいものも少なくありません。</p>
<p>SAMURAI GELは、成分と同じくらい「疲れているときでも飲みやすいこと」を大切にしました。<br>寒天を使い、味だけでなく、喉ごしと食感まで調整しています。</p>
</div>
<p class="min" style="font-size: clamp(19px,1.8vw,22px); font-weight: 800; line-height: 1.6; border-top: 1px solid #D2CDC2; padding-top: 20px">使った方から、いちばん多く届くのは<br>「飲みやすかった」という声です。</p>
</div>
<div class="photo" style="aspect-ratio: 4/3.2"><img src="media/photo_pouches_watch.jpg" alt="SAMURAI GELの刀と鎧とランニングウォッチ"></div>
</div>
<div class="grid4">
<div style="background: #FFFFFF; border-radius: 12px; padding: 26px; display: flex; flex-direction: column; gap: 10px">
<p class="en" style="font-size: 34px; font-weight: 700; color: #C41E3A; letter-spacing: .04em">01</p>
<p style="font-weight: 700; font-size: 20px">喉を通る</p>
<p style="color: #4A4740">呼吸が上がっていても、するっと通る喉ごし。</p>
</div>
<div style="background: #FFFFFF; border-radius: 12px; padding: 26px; display: flex; flex-direction: column; gap: 10px">
<p class="en" style="font-size: 34px; font-weight: 700; color: #C41E3A; letter-spacing: .04em">02</p>
<p style="font-weight: 700; font-size: 20px">口に残らない</p>
<p style="color: #4A4740">ベタつきを抑えた、軽い口当たり。</p>
</div>
<div style="background: #FFFFFF; border-radius: 12px; padding: 26px; display: flex; flex-direction: column; gap: 10px">
<p class="en" style="font-size: 34px; font-weight: 700; color: #C41E3A; letter-spacing: .04em">03</p>
<p style="font-weight: 700; font-size: 20px">わずかな食感</p>
<p style="color: #4A4740">寒天による、ほどよい食べごたえ。</p>
</div>
<div style="background: #FFFFFF; border-radius: 12px; padding: 26px; display: flex; flex-direction: column; gap: 10px">
<p class="en" style="font-size: 34px; font-weight: 700; color: #C41E3A; letter-spacing: .04em">04</p>
<p style="font-weight: 700; font-size: 20px">疲れてもおいしい</p>
<p style="color: #4A4740">後半でも、次の一本に手が伸びる味。</p>
</div>
</div>
</div>
</section>

<!-- ===== 03 刀と鎧 ===== -->
<section id="product" class="sec" style="background: #FFFFFF">
<div class="wrap" style="display: flex; flex-direction: column; gap: clamp(40px,5vw,64px)">
<div style="display: flex; flex-direction: column; gap: 20px; max-width: 780px">
<p class="eyebrow" style="color: #C41E3A">Katana / Yoroi</p>
<h2 class="h2">2種類あるのは、<br>役割が違うから。</h2>
<p class="lead" style="color: #4A4740">味違いの2種類ではありません。<br>前へ進むための「刀」と、疲れてきた身体を守る「鎧」。<br>レースの前半と後半では、身体が求めるものが違うからです。</p>
</div>
<div class="grid2">
<article class="pcard" style="background: #F5F3EE">
<div class="pvis v-k">
<img class="kj" src="media/kanji_katana.png" alt="">
<span class="tag">KATANA ／ ENERGY</span>
<img class="pk" src="media/pouch_katana.png" alt="SAMURAI GEL 刀のパッケージ">
</div>
<div style="padding: clamp(24px,3vw,36px); display: flex; flex-direction: column; gap: 22px">

<div>
<p class="lbl" style="color: #4A4740">いつ摂る？</p>
<p>スタートから約40分ごとを目安に、前半から中盤にかけて。<br>後半まで大きく崩れずに走るための、定期的な補給です。</p>
</div>
<div>
<p class="lbl" style="color: #4A4740">主な成分（1本あたり）</p>
<div class="row"><span>MCTオイル</span><span style="font-weight: 700">3,000mg</span></div>
<div class="row"><span>BCAA</span><span style="font-weight: 700">500mg</span></div>
<div class="row"><span>クエン酸</span><span style="font-weight: 700">400mg</span></div>
<div class="row"><span>マグネシウム</span><span style="font-weight: 700">50mg</span></div>
<div class="row"><span>カフェイン</span><span style="font-weight: 700">70mg</span></div>
<div class="row"><span>内容量・エネルギー</span><span style="font-weight: 700">45g ／ 74kcal</span></div>
<div class="row" style="border-bottom: 0"><span>味</span><span style="font-weight: 700">PINE &amp; HONEY</span></div>
</div>
</div>
</article>
<article class="pcard" style="background: #F5F3EE">
<div class="pvis v-y">
<img class="kj" src="media/kanji_yoroi.png" alt="">
<span class="tag">YOROI ／ RECOVERY</span>
<img class="pk" src="media/pouch_yoroi.png" alt="SAMURAI GEL 鎧のパッケージ">
</div>
<div style="padding: clamp(24px,3vw,36px); display: flex; flex-direction: column; gap: 22px">
<h3 class="min" style="font-size: clamp(24px,2.4vw,30px); font-weight: 800; line-height: 1.4">後半の粘りと、<br>走り終えたあとに。</h3>
<div>
<p class="lbl" style="color: #4A4740">いつ摂る？</p>
<p>フルマラソンなら30〜35km付近が目安。<br>記録を攻めるレースでは、15km付近で早めに入れる使い方も。運動後の補給にも。</p>
</div>
<div>
<p class="lbl" style="color: #4A4740">主な成分（1本あたり）</p>
<div class="row"><span>BCAA</span><span style="font-weight: 700">1,000mg</span></div>
<div class="row"><span>コラーゲンペプチド</span><span style="font-weight: 700">500mg</span></div>
<div class="row"><span>クエン酸</span><span style="font-weight: 700">400mg</span></div>
<div class="row"><span>カフェイン</span><span style="font-weight: 700">70mg</span></div>
<div class="row"><span>内容量・エネルギー</span><span style="font-weight: 700">40g ／ 33kcal</span></div>
<div class="row" style="border-bottom: 0"><span>味</span><span style="font-weight: 700">GUARANA &amp; HONEY</span></div>
</div>
</div>
</article>
</div>
<p style="font-size: 14px; color: #4A4740; margin-top: -28px">※成分・内容量・エネルギー・味は、オンラインストアの商品表示とパッケージのデザインデータ（2026年10月8日確認）より。どちらもカフェインを含みます。</p>
</div>

<!-- ===== 04 設計思想 ===== -->
<section id="design" class="sec" style="background: #F5F3EE">
<div class="wrap split">
<div style="display: flex; flex-direction: column; gap: 28px">
<p class="eyebrow" style="color: #C41E3A">Design Philosophy</p>
<h2 class="h2">カロリーの数字だけで、<br>選ばないでほしい。</h2>
<div class="lead" style="display: flex; flex-direction: column; gap: 20px; color: #2E2C28">

var NOTICE = "<div class=\"cnote\" id=\"howto\"><div class=\"wrap\">\n<p class=\"cnote-t\">確認用デザインカンプ（2026年10月8日版）</p>\n<p>サイトの構成と文章のご確認用ページです。実際のサイトではありません。</p>\n<ul>\n<li><span class=\"need\" style=\"padding:2px 10px\"><b>01</b>黄色の番号札</span>＝千坂さんに内容をいただきたい箇所です（番号は穴埋めシートと共通）</li>\n<li><span class=\"chk\" style=\"padding:2px 10px\">要確認</span>＝公開情報から転記した事実、または表現チェックが必要な箇所です</li>\n<li>グレーの写真枠＝撮影・素材待ちの箇所です（枠内に何の写真かを記載）</li>\n<li>それ以外の文章は、そのまま使う想定の原稿です</li>\n<li>補給シミュレーターは押すと動きます（タイミングのルールは仮です）</li>\n</ul></div></div>";
function get(scope, path){
